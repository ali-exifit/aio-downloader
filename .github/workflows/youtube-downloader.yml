name: youtube-downloader (enhanced)

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          Enter one or more YouTube URLs. Each can be followed by optional
          “v”/“a” and a quality value (e.g. “v 480” or “a 192”).
          Separate entries with newlines, commas, or spaces.
        required: true
        type: string

      output_format:
        description: ‘Output format (applied when no per‑URL “v”/“a” is given)’
        required: false
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
          - best (auto)
        default: ‘mp4 (video)’

      video_quality:
        description: ‘Max video resolution (720p if nothing is specified)’
        required: false
        type: choice
        options:
          - ‘2160 (4K)’
          - ‘1080 (Full HD)’
          - ‘720 (HD)’
          - ‘480’
          - ‘360’
          - ‘best’
        default: ‘720 (HD)’

      audio_quality:
        description: ‘Audio bitrate for MP3 downloads’
        required: false
        type: choice
        options:
          - ‘320’
          - ‘192’
          - ‘128’
          - ‘64’
        default: ‘192’

      codec:
        description: ‘Preferred video codec (ignored for audio‑only)’
        required: false
        type: choice
        options:
          - ‘any (auto)’
          - ‘h264 (MP4 compatible)’
          - ‘vp9’
          - ‘av1’
        default: ‘any (auto)’

      playlist_items:
        description: ‘Playlist items (all, 3-7, 1,3,5, …). Leave empty for single video.’
        required: false
        type: string

      sponsorblock:
        description: ‘Skip sponsor/intro/outro segments via SponsorBlock’
        required: false
        type: boolean
        default: false

      embed_chapters:
        description: ‘Embed chapter markers in the output file’
        required: false
        type: boolean
        default: true

      write_description:
        description: ‘Save video description as a .description file’
        required: false
        type: boolean
        default: false

      download_subtitles:
        description: ‘Download subtitle files’
        required: false
        type: boolean
        default: false

      subtitle_langs:
        description: ‘Subtitle languages (comma‑separated, e.g. en,fa)’
        required: false
        type: string
        default: ‘en’

      embed_metadata:
        description: ‘Embed thumbnail and metadata in the output file’
        required: false
        type: boolean
        default: true

      trim_start:
        description: ‘Trim start timestamp (e.g. 0:33 or 1:22:10) – leave empty to skip’
        required: false
        type: string

      trim_end:
        description: ‘Trim end timestamp (e.g. 1:22 or 2:00:00) – leave empty to skip’
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      # Cookies (from secret only, no inline field)
      - name: ‘🔐 Prepare cookies’
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube-cookies.txt
            echo "✅ YouTube cookies written from secret."
          else
            echo "ℹ️  No YOUTUBE_COOKIES secret – proceeding without cookies."
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      # Parse URLs & per‑URL arguments
      - name: ‘📋 Parse all URLs and per‑URL arguments’
        id: parse
        run: |
          INPUT="${{ github.event.inputs.url }}"
          MODIFIED=$(echo "$INPUT" | tr ',' '\n')
          ENTRIES='[]'
          while IFS= read -r line; do
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue
            tokens=($line)
            i=0
            while [ $i -lt ${#tokens[@]} ]; do
              token="${tokens[$i]}"
              if [[ "$token" =~ ^https?:// ]]; then
                link="$token"
                args=()
                i=$((i+1))
                while [ $i -lt ${#tokens[@]} ]; do
                  next="${tokens[$i]}"
                  [[ "$next" =~ ^https?:// ]] && break
                  args+=("$next")
                  i=$((i+1))
                done
                args_json=$(printf '%s\n' "${args[@]}" | jq -R . | jq -s .)
                entry=$(jq -n --arg link "$link" --argjson args "$args_json" '{link: $link, args: $args}')
                ENTRIES=$(echo "$ENTRIES" | jq ". + [$entry]")
              else
                i=$((i+1))
              fi
            done
          done <<< "$MODIFIED"

          ENTRIES_JSON=$(echo "$ENTRIES" | jq -c .)
          echo "ENTRIES_JSON=$ENTRIES_JSON" >> $GITHUB_OUTPUT
          IS_ANY_YT=$(echo "$ENTRIES" | jq '[.[].link | test("youtube\\.com/watch\\?v=|youtu\\.be/")] | any')
          echo "IS_ANY_YT=$IS_ANY_YT" >> $GITHUB_OUTPUT
          echo "✅ Parsed $(echo "$ENTRIES" | jq length) entries, any YouTube? $IS_ANY_YT"

      # PATH setup
      - name: ‘📁 Prepare tool paths’
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          echo "✅ Tool paths prepared."

      # Install tools
      - name: ‘🛠️ Install download tools’
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          echo "🔽 Installing / updating yt-dlp..."
          if ! command -v yt-dlp &> /dev/null; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
            chmod a+rx ~/.local/bin/yt-dlp
          fi
          echo "✅ yt-dlp ready."

          echo "🔽 Installing jq, ffmpeg..."
          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq ffmpeg
          fi
          echo "✅ jq & ffmpeg ready."

          echo "🔽 Installing Deno..."
          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
          fi
          echo "✅ Deno ready."

          echo "🔽 Installing additional fallback dependencies..."
          sudo apt-get install -y -qq python3-pip
          pip3 install --quiet pytube youtube-dl
          sudo curl -L https://yt-dl.org/downloads/latest/youtube-dl -o /usr/local/bin/youtube-dl
          sudo chmod a+rx /usr/local/bin/youtube-dl
          echo "✅ Fallback tools installed."

      # Primary download
      - name: ‘⬇️  Primary download (yt‑dlp with global selectors)’
        id: primary
        run: |
          set -e
          ENTRIES_JSON='${{ steps.parse.outputs.ENTRIES_JSON }}'
          OUTPUT_FOLDER="youtube"   # fixed folder
          mkdir -p "$OUTPUT_FOLDER"

          # ── Build global yt‑dlp arguments from selectors ──
          FORMAT_INPUT="${{ github.event.inputs.output_format }}"
          VIDEO_QUALITY="${{ github.event.inputs.video_quality }}"
          AUDIO_Q="${{ github.event.inputs.audio_quality }}"
          CODEC="${{ github.event.inputs.codec }}"
          FRAGMENTS="4"           # fixed
          SPONSORBLOCK="${{ github.event.inputs.sponsorblock }}"
          EMBED_CHAPTERS="${{ github.event.inputs.embed_chapters }}"
          WRITE_DESC="${{ github.event.inputs.write_description }}"
          SUBTITLES="${{ github.event.inputs.download_subtitles }}"
          SUB_LANGS="${{ github.event.inputs.subtitle_langs }}"
          EMBED_META="${{ github.event.inputs.embed_metadata }}"
          TRIM_START="${{ github.event.inputs.trim_start }}"
          TRIM_END="${{ github.event.inputs.trim_end }}"
          PLAYLIST_ITEMS="${{ github.event.inputs.playlist_items }}"

          # Cookies
          COOKIE_ARGS=""
          [ -f youtube-cookies.txt ] && COOKIE_ARGS="--cookies youtube-cookies.txt"

          QUALITY_NUM=$(echo "$VIDEO_QUALITY" | grep -o '[0-9]*' | head -1)

          case "$CODEC" in
            "h264 (MP4 compatible)") CODEC_FILTER="[vcodec^=avc]" ; MERGE_FMT="mp4" ;;
            "vp9") CODEC_FILTER="[vcodec^=vp9]" ; MERGE_FMT="mkv" ;;
            "av1") CODEC_FILTER="[vcodec^=av01]" ; MERGE_FMT="mkv" ;;
            *) CODEC_FILTER="" ; MERGE_FMT="mp4" ;;
          esac

          if [ "$FORMAT_INPUT" = "mp3 (audio only)" ]; then
            GLOBAL_FORMAT="-x --audio-format mp3 --audio-quality ${AUDIO_Q}K"
            GLOBAL_TYPE="a"
          elif [ "$FORMAT_INPUT" = "best (auto)" ] || [ "$VIDEO_QUALITY" = "best" ]; then
            GLOBAL_FORMAT="-f bestvideo+bestaudio --merge-output-format mp4"
            GLOBAL_TYPE="v"
          else
            if [ -n "$CODEC_FILTER" ]; then
              GLOBAL_FORMAT="-f bestvideo[height<=${QUALITY_NUM}]${CODEC_FILTER}+bestaudio/bestvideo[height<=${QUALITY_NUM}]+bestaudio/best[height<=${QUALITY_NUM}] --merge-output-format ${MERGE_FMT}"
            else
              GLOBAL_FORMAT="-f bestvideo[height<=${QUALITY_NUM}]+bestaudio/best[height<=${QUALITY_NUM}] --merge-output-format mp4"
            fi
            GLOBAL_TYPE="v"
          fi

          # Trim / section
          SECTION_ARGS=""
          if [ -n "$TRIM_START" ] && [ -n "$TRIM_END" ]; then
            SECTION_ARGS="--download-sections *${TRIM_START}-${TRIM_END} --force-keyframes-at-cuts"
          elif [ -n "$TRIM_START" ]; then
            SECTION_ARGS="--download-sections *${TRIM_START}-inf --force-keyframes-at-cuts"
          elif [ -n "$TRIM_END" ]; then
            SECTION_ARGS="--download-sections *0-${TRIM_END} --force-keyframes-at-cuts"
          fi

          # Playlist
          PLAYLIST_ARGS="--no-playlist"
          if [ -n "$PLAYLIST_ITEMS" ]; then
            if [ "$PLAYLIST_ITEMS" = "all" ]; then
              PLAYLIST_ARGS=""
            else
              PLAYLIST_ARGS="--playlist-items $PLAYLIST_ITEMS"
            fi
          fi

          # Subtitles
          SUBTITLE_ARGS=""
          if [ "$SUBTITLES" = "true" ]; then
            SUBTITLE_ARGS="--write-subs --write-auto-subs --sub-langs ${SUB_LANGS}"
          fi

          # Metadata
          META_ARGS=""
          if [ "$EMBED_META" = "true" ]; then
            META_ARGS="--embed-thumbnail --embed-metadata --add-metadata"
          fi

          # Chapters
          CHAPTER_ARGS=""
          if [ "$EMBED_CHAPTERS" = "true" ]; then
            CHAPTER_ARGS="--embed-chapters"
          fi

          # SponsorBlock
          SPONSOR_ARGS=""
          if [ "$SPONSORBLOCK" = "true" ]; then
            SPONSOR_ARGS="--sponsorblock-remove sponsor,intro,outro,selfpromo,interaction"
          fi

          # Description
          DESC_ARGS=""
          if [ "$WRITE_DESC" = "true" ]; then
            DESC_ARGS="--write-description"
          fi

          echo "🔧 Global settings:"
          echo "   Format: $FORMAT_INPUT  Video quality: $VIDEO_QUALITY  Audio: $AUDIO_Q"
          echo "   Codec: $CODEC"
          echo "   SponsorBlock: $SPONSORBLOCK  Chapters: $EMBED_CHAPTERS  Subtitles: $SUBTITLES"
          echo "   Playlist items: ${PLAYLIST_ITEMS:-single video}"

          # ── Download each entry ──
          FAILED_ENTRIES='[]'
          count=$(echo "$ENTRIES_JSON" | jq length)
          for ((idx=0; idx<count; idx++)); do
            entry=$(echo "$ENTRIES_JSON" | jq ".[$idx]")
            link=$(echo "$entry" | jq -r '.link')
            args_len=$(echo "$entry" | jq '.args | length')
            echo "========================================"
            echo "🎬 Processing $((idx+1))/$count: $link"

            type="$GLOBAL_TYPE"
            val1="$QUALITY_NUM"
            if [ "$args_len" -ge 1 ]; then
              type=$(echo "$entry" | jq -r '.args[0]')
            fi
            if [ "$args_len" -ge 2 ]; then
              val1=$(echo "$entry" | jq -r '.args[1]')
            fi

            if [[ "$type" != "v" && "$type" != "a" ]]; then
              echo "⚠️  Invalid type '$type' – using global default"
              type="$GLOBAL_TYPE"
              val1="$QUALITY_NUM"
            fi

            # If no quality given, cap at 720p
            if [ "$args_len" -lt 2 ] && [ -z "$QUALITY_NUM" ]; then
              val1="720"
              echo "ℹ️  No quality specified – limiting to 720p"
            fi

            if [ "$type" = "v" ]; then
              case "$val1" in 2k) val1=1440 ;; 4k) val1=2160 ;; esac
              FINAL_ARGS="-f bestvideo[height<=${val1}]+bestaudio/best[height<=${val1}] --merge-output-format mp4"
            else
              FINAL_ARGS="-x --audio-format mp3 --audio-quality ${val1}K"
            fi

            echo "   🏷️  Type: $type  Quality: $val1  (per‑URL override: $([ $args_len -ge 1 ] && echo 'yes' || echo 'no'))"

            # Non‑YouTube links
            if ! echo "$link" | grep -Eq '(youtube\.com/watch\?v=|youtu\.be/)'; then
              echo "ℹ️  Non‑YouTube link – downloading with wget"
              cd "$OUTPUT_FOLDER"
              wget --progress=bar:force --content-disposition "$link" || {
                echo "❌ wget failed"
                FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [$entry]")
                cd ..
                continue
              }
              cd ..
              continue
            fi

            # Build command
            if [ "$args_len" -ge 2 ]; then
              CMD="yt-dlp \
                --js-runtimes deno \
                --newline \
                --extractor-args \"youtube:player_client=web_music,web,tv\" \
                --concurrent-fragments 4 \
                $SECTION_ARGS \
                $SUBTITLE_ARGS \
                $META_ARGS \
                $CHAPTER_ARGS \
                $SPONSOR_ARGS \
                $DESC_ARGS \
                $PLAYLIST_ARGS \
                $COOKIE_ARGS \
                -o \"$OUTPUT_FOLDER/%(title)s [%(id)s].%(ext)s\" \
                \"$link\""
            else
              CMD="yt-dlp \
                --js-runtimes deno \
                --newline \
                --extractor-args \"youtube:player_client=web_music,web,tv\" \
                --concurrent-fragments 4 \
                $GLOBAL_FORMAT \
                $SECTION_ARGS \
                $SUBTITLE_ARGS \
                $META_ARGS \
                $CHAPTER_ARGS \
                $SPONSOR_ARGS \
                $DESC_ARGS \
                $PLAYLIST_ARGS \
                $COOKIE_ARGS \
                -o \"$OUTPUT_FOLDER/%(title)s [%(id)s].%(ext)s\" \
                \"$link\""
            fi

            echo "   🚀 Running: $CMD"
            if ! eval "$CMD"; then
              echo "❌ Primary download failed – will try fallbacks later"
              FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [$entry]")
            else
              echo "   ✅ Download succeeded"
            fi
          done

          FAILED_ENTRIES_JSON=$(echo "$FAILED_ENTRIES" | jq -c .)
          echo "FAILED_ENTRIES_JSON=$FAILED_ENTRIES_JSON" >> $GITHUB_OUTPUT
          echo "📊 Primary phase done. Failures: $(echo "$FAILED_ENTRIES" | jq length)"

      # Fallback pipelines
      - name: ‘🔄 Fallback pipelines for failed entries’
        if: steps.primary.outputs.FAILED_ENTRIES_JSON != '[]'
        run: |
          set -e
          FAILED_ENTRIES='${{ steps.primary.outputs.FAILED_ENTRIES_JSON }}'
          count=$(echo "$FAILED_ENTRIES" | jq length)
          echo "🔄 Attempting fallback for $count failed entries..."

          OUTPUT_FOLDER="youtube"

          fallback_ytdlp_extractor() {
            echo "[fallback 1] yt-dlp with Android extractor"
            yt-dlp --cookies youtube-cookies.txt --extractor-args "youtube:player_client=android" \
                   --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$1"
          }
          fallback_ytdlp_ios() {
            echo "[fallback 2] yt-dlp with iOS extractor"
            yt-dlp --cookies youtube-cookies.txt --extractor-args "youtube:player_client=ios" \
                   --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$1"
          }
          fallback_ytdlp_nocookies() {
            echo "[fallback 3] yt-dlp without cookies"
            yt-dlp --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$1"
          }
          fallback_youtube_dl() {
            echo "[fallback 4] youtube-dl"
            youtube-dl --no-progress -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$1"
          }
          fallback_pytube_max() {
            echo "[fallback 5] pytube (best quality)"
            python3 -c "
          import sys
          from pytube import YouTube
          url = sys.argv[1]
          yt = YouTube(url)
          if '$2' == 'a':
              stream = yt.streams.get_audio_only()
              stream.download(output_path='$OUTPUT_FOLDER')
          else:
              stream = yt.streams.get_highest_resolution()
              stream.download(output_path='$OUTPUT_FOLDER')
          " "$1"
          }
          fallback_pytube_res() {
            echo "[fallback 6] pytube (resolution $3)"
            python3 -c "
          import sys
          from pytube import YouTube
          url = sys.argv[1]
          target_res = int(sys.argv[2])
          yt = YouTube(url)
          streams = yt.streams.filter(progressive=True, res='{}p'.format(target_res))
          if not streams:
              streams = yt.streams.filter(adaptive=True, res='{}p'.format(target_res))
          if streams:
              streams.first().download(output_path='$OUTPUT_FOLDER')
          else:
              yt.streams.get_highest_resolution().download(output_path='$OUTPUT_FOLDER')
          " "$1" "$3"
          }
          fallback_thirdparty_api1() {
            echo "[fallback 7] External API (loader.to)"
            API_URL="https://loader.to/ajax/download.php?format=best&url=$(python3 -c "
          import urllib.parse
          print(urllib.parse.quote('$1'))
          ")"
            resp=$(curl -s "$API_URL")
            dlink=$(echo "$resp" | jq -r '.link? // empty')
            if [ -n "$dlink" ]; then
              wget -O "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$dlink"
            else
              return 1
            fi
          }
          fallback_thirdparty_api2() {
            echo "[fallback 8] External API (api.vevioz.com)"
            API_URL="https://api.vevioz.com/apis/downloader?url=$(python3 -c "
          import urllib.parse
          print(urllib.parse.quote('$1'))
          ")"
            resp=$(curl -s "$API_URL")
            dlink=$(echo "$resp" | jq -r '.download_url? // empty')
            if [ -n "$dlink" ]; then
              wget -O "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$dlink"
            else
              return 1
            fi
          }
          fallback_cobalt() {
            echo "[fallback 9] cobalt.tools API"
            API_URL="https://api.cobalt.tools/api/json"
            payload='{"url":"'"$1"'","vCodec":"h264","aFormat":"mp3","videoQuality":"720"}'
            resp=$(curl -s -H "Content-Type: application/json" -d "$payload" "$API_URL")
            dlink=$(echo "$resp" | jq -r '.url? // empty')
            if [ -n "$dlink" ]; then
              wget -O "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$dlink"
            else
              return 1
            fi
          }
          fallback_force_ipv4() {
            echo "[fallback 10] yt-dlp with forced IPv4 and retries"
            yt-dlp --force-ipv4 --retries 10 --fragment-retries 10 --cookies youtube-cookies.txt \
                   --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s.%(ext)s" "$1"
          }

          # NEW fallback 11: Meli-Action ytmp3.gg API
          fallback_ytmp3_api() {
            echo "[fallback 11] ytmp3.gg API (Meli-Action style)"
            FORMAT="mp4"
            QUALITY="720p"
            if [ "$2" = "a" ]; then
              FORMAT="mp3"
              QUALITY="${3:-192}kbps"
            fi
            python3 << 'PYEOF'
          import os, sys, time, re, requests
          URL = os.environ.get('FB_URL')
          FMT = os.environ.get('FB_FMT')
          QUAL = os.environ.get('FB_QUAL')
          is_audio = FMT == 'mp3'
          if is_audio:
              QUAL = QUAL if QUAL in ('64kbps','128kbps','192kbps','320kbps') else '192kbps'
          else:
              QUAL = QUAL if QUAL in ('720p','1080p') else '720p'
          payload = { "url": URL, "os": "linux", "output": {"type": "audio" if is_audio else "video", "format": FMT} }
          if is_audio:
              payload["audio"] = {"bitrate": QUAL}
          else:
              payload["output"]["quality"] = QUAL
          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0"})
          s.get("https://media.ytmp3.gg/")
          resp = s.post("https://hub.ytconvert.org/api/download", json=payload, timeout=30)
          resp.raise_for_status()
          data = resp.json()
          status_url = data.get('statusUrl')
          title = data.get('title', 'video')
          dl_url = None
          for _ in range(150):
              time.sleep(2)
              r = s.get(status_url, timeout=20)
              status = r.json()
              if status.get('status') == 'completed':
                  dl_url = status.get('downloadUrl')
                  break
              if status.get('status') == 'failed':
                  print("::error::Server failed to prepare the video")
                  sys.exit(1)
          if not dl_url:
              print("::error::Could not get download link")
              sys.exit(1)
          vid = re.search(r'(?:v=|youtu\.be/)([a-zA-Z0-9_-]{11})', URL)[1]
          clean = re.sub(r'[^a-zA-Z0-9\-_()\[\]]', '_', title.replace(' ', '_'))
          clean = re.sub(r'_+', '_', clean).strip('_')[:70] or vid
          fname = f"{clean}_{vid}_{QUAL}.{FMT}"
          with open(".download_info", "w", encoding="utf-8") as f:
              f.write(f"{dl_url}\n{fname}\n{title}")
          PYEOF
            DL_URL=$(head -1 .download_info)
            FILENAME=$(sed -n '2p' .download_info)
            echo "   🌐 Downloading via ytmp3.gg: $FILENAME"
            curl -L --fail --progress-bar -o "$OUTPUT_FOLDER/$FILENAME" "$DL_URL"
            if [ ! -s "$OUTPUT_FOLDER/$FILENAME" ]; then
              echo "❌ ytmp3.gg download empty"
              return 1
            fi
            echo "   ✅ ytmp3.gg success"
          }

          # NEW fallback 12: Advanced yt‑dlp (Meli‑Action style)
          fallback_ytdlp_advanced() {
            echo "[fallback 12] yt-dlp with web_music+tv+web clients"
            yt-dlp \
              --js-runtimes deno \
              --newline \
              --extractor-args "youtube:player_client=web_music,web,tv" \
              --concurrent-fragments 4 \
              $COOKIE_ARGS \
              -o "$OUTPUT_FOLDER/%(title)s [%(id)s].%(ext)s" \
              "$1"
          }

          FALLBACKS=(
            fallback_ytdlp_extractor
            fallback_ytdlp_ios
            fallback_ytdlp_nocookies
            fallback_youtube_dl
            fallback_pytube_max
            fallback_pytube_res
            fallback_thirdparty_api1
            fallback_thirdparty_api2
            fallback_cobalt
            fallback_force_ipv4
            fallback_ytmp3_api
            fallback_ytdlp_advanced
          )

          # Run fallbacks
          for ((idx=0; idx<count; idx++)); do
            entry=$(echo "$FAILED_ENTRIES" | jq ".[$idx]")
            link=$(echo "$entry" | jq -r '.link')
            args_len=$(echo "$entry" | jq '.args | length')
            type="v"; val1="max"
            [ "$args_len" -ge 1 ] && type=$(echo "$entry" | jq -r '.args[0]')
            [ "$args_len" -ge 2 ] && val1=$(echo "$entry" | jq -r '.args[1]')

            if ! echo "$link" | grep -Eq '(youtube\.com/watch\?v=|youtu\.be/)'; then
              continue
            fi

            echo "========================================"
            echo "🔄 Fallback for: $link ($type $val1)"
            success=0
            for func in "${FALLBACKS[@]}"; do
              if $func "$link" "$type" "$val1"; then
                echo "   ✅ Fallback '$func' succeeded"
                success=1
                break
              else
                echo "   ❌ Fallback '$func' failed"
              fi
            done
            if [ $success -eq 0 ]; then
              echo "❌ All 12 fallback pipelines failed for $link"
            fi
          done
        env:
          OUTPUT_FOLDER: youtube
          FRAGMENTS: 4
          COOKIE_ARGS: ${{ steps.primary.outputs.COOKIE_ARGS }}

      # Split files >90MB into .zip parts (exact original behavior)
      - name: ‘✂️  Split oversized files (>90MB)’
        run: |
          OUTPUT_FOLDER="youtube"
          THRESH_MB=90
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))
          echo "🔍 Checking files in '$OUTPUT_FOLDER' for >${THRESH_MB}MB..."
          for f in "$OUTPUT_FOLDER"/*; do
            [ -f "$f" ] || continue
            fs=$(stat -c%s "$f")
            fname=$(basename "$f")
            if [ "$fs" -gt "$THRESH_BYTES" ]; then
              echo "   ✂️  Splitting $fname ($((fs/1024/1024)) MB) into ${THRESH_MB}MB parts"
              zip -j -s "${THRESH_MB}m" "$OUTPUT_FOLDER/${fname}.zip" "$f"
              rm "$f"
            fi
          done
          echo "✅ Splitting complete."

      # Push to repo (always, no release option)
      - name: ‘📤 Push to repository’
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add youtube/
          git commit -m "⬇️ YouTube download [skip ci]" || echo "Nothing to commit"
          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "🚀 Push attempt $i..."
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            if git push origin "${{ github.ref_name }}"; then
              echo "✅ Push succeeded"
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "⏳ Push rejected, retrying in 3s..."
                sleep 3
              else
                echo "❌ Push failed after $RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: ‘🧹 Cleanup’
        if: always()
        run: |
          rm -rf .download_info youtube-cookies.txt 2>/dev/null || true
          echo "✅ Cleanup done."
