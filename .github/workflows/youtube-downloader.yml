name: youtube-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          Enter one or more YouTube URLs. Each can be followed by optional
          “v”/“a” and a quality value (e.g. “v 480” or “a 192”).
          Separate entries with newlines, commas, or spaces.
        required: true
        type: string

      output_format:
        description: ‘Output format (applied when no per‑URL “v”/“a” is given)’
        required: false
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
          - best (auto)
        default: ‘mp4 (video)’

      video_quality:
        description: ‘Max video resolution (720p if nothing is specified)’
        required: false
        type: choice
        options:
          - ‘2160 (4K)’
          - ‘1080 (Full HD)’
          - ‘720 (HD)’
          - ‘480’
          - ‘360’
          - ‘best’
        default: ‘720 (HD)’

      audio_quality:
        description: ‘Audio bitrate for MP3 downloads’
        required: false
        type: choice
        options:
          - ‘320’
          - ‘192’
          - ‘128’
          - ‘64’
        default: ‘192’

      codec:
        description: ‘Preferred video codec (ignored for audio‑only)’
        required: false
        type: choice
        options:
          - ‘any (auto)’
          - ‘h264 (MP4 compatible)’
          - ‘vp9’
          - ‘av1’
        default: ‘any (auto)’

      preferred_language:
        description: ‘Preferred audio language (original if nothing is chosen)’
        required: false
        type: choice
        options:
          - ‘Original (default)’
          - ‘English’
          - ‘Persian (فارسی)’
          - ‘Arabic (العربية)’
          - ‘Japanese (日本語)’
          - ‘Chinese (中文)’
          - ‘Spanish (Español)’
          - ‘French (Français)’
          - ‘German (Deutsch)’
          - ‘Russian (Русский)’
          - ‘Korean (한국어)’
          - ‘Hindi (हिन्दी)’
          - ‘Portuguese (Português)’
          - ‘Italian (Italiano)’
        default: ‘Original (default)’

      playlist_items:
        description: ‘Playlist items (all, 3-7, 1,3,5, …). Leave empty for single video.’
        required: false
        type: string

      sponsorblock:
        description: ‘Skip sponsor/intro/outro segments via SponsorBlock’
        required: false
        type: boolean
        default: false

      embed_chapters:
        description: ‘Embed chapter markers in the output file’
        required: false
        type: boolean
        default: false

      write_description:
        description: ‘Save video description as a .description file’
        required: false
        type: boolean
        default: false

      download_subtitles:
        description: ‘Download subtitle files’
        required: false
        type: boolean
        default: false

      subtitle_langs:
        description: ‘Subtitle languages (comma‑separated, e.g. en,fa)’
        required: false
        type: string
        default: ‘en’

      embed_metadata:
        description: ‘Embed thumbnail and metadata in the output file’
        required: false
        type: boolean
        default: false

      trim_start:
        description: ‘Trim start timestamp (e.g. 0:33 or 1:22:10) – leave empty to skip’
        required: false
        type: string

      trim_end:
        description: ‘Trim end timestamp (e.g. 1:22 or 2:00:00) – leave empty to skip’
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: ‘🔐 Prepare cookies’
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube-cookies.txt
            echo "✅ YouTube cookies written from secret."
          else
            echo "ℹ️  No YOUTUBE_COOKIES secret – proceeding without cookies."
          fi
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}

      - name: ‘📋 Parse all URLs and per‑URL arguments’
        id: parse
        run: |
          INPUT="${{ github.event.inputs.url }}"
          MODIFIED=$(echo "$INPUT" | tr ',' '\n')
          ENTRIES='[]'
          while IFS= read -r line; do
            line=$(echo "$line" | xargs)
            [ -z "$line" ] && continue
            tokens=($line)
            i=0
            while [ $i -lt ${#tokens[@]} ]; do
              token="${tokens[$i]}"
              if [[ "$token" =~ ^https?:// ]]; then
                link="$token"
                args=()
                i=$((i+1))
                while [ $i -lt ${#tokens[@]} ]; do
                  next="${tokens[$i]}"
                  [[ "$next" =~ ^https?:// ]] && break
                  args+=("$next")
                  i=$((i+1))
                done
                args_json=$(printf '%s\n' "${args[@]}" | jq -R . | jq -s .)
                entry=$(jq -n --arg link "$link" --argjson args "$args_json" '{link: $link, args: $args}')
                ENTRIES=$(echo "$ENTRIES" | jq ". + [$entry]")
              else
                i=$((i+1))
              fi
            done
          done <<< "$MODIFIED"

          ENTRIES_JSON=$(echo "$ENTRIES" | jq -c .)
          echo "ENTRIES_JSON=$ENTRIES_JSON" >> $GITHUB_OUTPUT
          IS_ANY_YT=$(echo "$ENTRIES" | jq '[.[].link | test("youtube\\.com/watch\\?v=|youtu\\.be/")] | any')
          echo "IS_ANY_YT=$IS_ANY_YT" >> $GITHUB_OUTPUT
          echo "✅ Parsed $(echo "$ENTRIES" | jq length) entries, any YouTube? $IS_ANY_YT"

      - name: ‘📁 Prepare tool paths’
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          echo "✅ Tool paths prepared."

      - name: ‘🛠️ Install download tools’
        if: steps.parse.outputs.IS_ANY_YT == 'true'
        run: |
          echo "🔽 Installing / updating yt-dlp..."
          if ! command -v yt-dlp &> /dev/null; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
            chmod a+rx ~/.local/bin/yt-dlp
          fi
          echo "✅ yt-dlp ready."

          echo "🔽 Installing jq, ffmpeg..."
          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq ffmpeg
          fi
          echo "✅ jq & ffmpeg ready."

          echo "🔽 Installing Deno..."
          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
          fi
          echo "✅ Deno ready."

          echo "🔽 Installing additional fallback dependencies..."
          sudo apt-get install -y -qq python3-pip
          pip3 install --quiet pytube youtube-dl
          sudo curl -L https://yt-dl.org/downloads/latest/youtube-dl -o /usr/local/bin/youtube-dl
          sudo chmod a+rx /usr/local/bin/youtube-dl
          echo "✅ Fallback tools installed."

      # ════════════════════════════════════════════════════════
      #  PRIMARY DOWNLOAD – with original‑language detection
      # ════════════════════════════════════════════════════════
      - name: ‘⬇️ Primary download (language‑aware)’
        id: primary_download
        run: |
          set -e
          ENTRIES_JSON='${{ steps.parse.outputs.ENTRIES_JSON }}'
          OUTPUT_FOLDER="youtube"
          mkdir -p "$OUTPUT_FOLDER"

          # Global defaults
          GLOBAL_FORMAT="${{ github.event.inputs.output_format }}"
          GLOBAL_VQ="${{ github.event.inputs.video_quality }}"
          GLOBAL_AQ="${{ github.event.inputs.audio_quality }}"
          CODEC="${{ github.event.inputs.codec }}"
          USER_LANG_CHOICE="${{ github.event.inputs.preferred_language }}"

          # Map human‑readable to ISO‑639-1
          case "$USER_LANG_CHOICE" in
            "Original (default)") USER_LANG="original" ;;
            "English")            USER_LANG="en" ;;
            "Persian (فارسی)")    USER_LANG="fa" ;;
            "Arabic (العربية)")   USER_LANG="ar" ;;
            "Japanese (日本語)")   USER_LANG="ja" ;;
            "Chinese (中文)")     USER_LANG="zh" ;;
            "Spanish (Español)")  USER_LANG="es" ;;
            "French (Français)")  USER_LANG="fr" ;;
            "German (Deutsch)")   USER_LANG="de" ;;
            "Russian (Русский)")  USER_LANG="ru" ;;
            "Korean (한국어)")    USER_LANG="ko" ;;
            "Hindi (हिन्दी)")     USER_LANG="hi" ;;
            "Portuguese (Português)") USER_LANG="pt" ;;
            "Italian (Italiano)") USER_LANG="it" ;;
            *)                    USER_LANG="original" ;;
          esac

          # Numeric quality values
          GLOBAL_VQ_NUM=$(echo "$GLOBAL_VQ" | grep -o '[0-9]*' | head -1)
          GLOBAL_AQ_NUM=$(echo "$GLOBAL_AQ" | grep -o '[0-9]*' | head -1)

          # Default type from format selector
          if [ "$GLOBAL_FORMAT" = "mp3 (audio only)" ]; then
            GLOBAL_TYPE="a"
            GLOBAL_VAL="$GLOBAL_AQ_NUM"
          else
            GLOBAL_TYPE="v"
            GLOBAL_VAL="$GLOBAL_VQ_NUM"
          fi

          COOKIE_ARGS=""
          [ -f youtube-cookies.txt ] && COOKIE_ARGS="--cookies youtube-cookies.txt"

          echo "🔧 Global: type=$GLOBAL_TYPE, quality=$GLOBAL_VAL, lang choice=$USER_LANG_CHOICE ($USER_LANG)"

          FAILED_ENTRIES='[]'
          count=$(echo "$ENTRIES_JSON" | jq length)
          for ((idx=0; idx<count; idx++)); do
            entry=$(echo "$ENTRIES_JSON" | jq ".[$idx]")
            link=$(echo "$entry" | jq -r '.link')
            args_len=$(echo "$entry" | jq '.args | length')
            echo "========================================"
            echo "🎬 $((idx+1))/$count: $link"

            # Per‑URL overrides for type/quality
            type="$GLOBAL_TYPE"
            val="$GLOBAL_VAL"
            if [ "$args_len" -ge 1 ]; then
              type=$(echo "$entry" | jq -r '.args[0]')
            fi
            if [ "$args_len" -ge 2 ]; then
              val=$(echo "$entry" | jq -r '.args[1]')
            fi
            if [[ "$type" != "v" && "$type" != "a" ]]; then
              echo "⚠️  Invalid type '$type' – using $GLOBAL_TYPE"
              type="$GLOBAL_TYPE"
              val="$GLOBAL_VAL"
            fi
            if [ -z "$val" ] || [ "$val" = "max" ]; then
              [ "$type" = "v" ] && val="720" || val="192"
              echo "ℹ️  No quality – using $val"
            fi

            # Non‑YouTube
            if ! echo "$link" | grep -Eq '(youtube\.com/watch\?v=|youtu\.be/)'; then
              echo "ℹ️  Non‑YouTube – wget"
              cd "$OUTPUT_FOLDER"
              wget --progress=bar:force --content-disposition "$link" || {
                FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [$entry]")
                cd .. ; continue
              }
              cd ..
              continue
            fi

            # ─── Fetch JSON and resolve original language ───
            echo "   🔍 Fetching info..."
            JSON_ARGS="--cookies youtube-cookies.txt --js-runtimes deno --remote-components ejs:npm"
            video_json=$(yt-dlp $JSON_ARGS -j "$link" 2>/dev/null) || {
              echo "❌ yt-dlp -j failed"; FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [$entry]"); continue
            }

            # Video's declared original language (empty if not set)
            ORIGINAL_LANG=$(echo "$video_json" | jq -r '.language // ""')
            if [ "$ORIGINAL_LANG" = "null" ]; then ORIGINAL_LANG=""; fi

            # Resolve target language
            if [ "$USER_LANG" = "original" ]; then
              TARGET_LANG="$ORIGINAL_LANG"
              if [ -z "$TARGET_LANG" ]; then
                # No original language declared → try audio tracks with no language tag
                NO_LANG_AUDIO=$(echo "$video_json" | jq '[.formats[] | select(.vcodec=="none" and .acodec!="none" and (.language == null or .language == ""))] | length')
                if [ "$NO_LANG_AUDIO" -gt 0 ]; then
                  TARGET_LANG="__NULL__"
                  echo "   🎧 Original language not set – using audio tracks without language tag"
                else
                  TARGET_LANG=""
                  echo "   ⚠️  Could not determine original language – falling back to best audio overall"
                fi
              fi
            else
              TARGET_LANG="$USER_LANG"
            fi

            # Build extractor argument for yt-dlp
            LANG_EXTRACTOR=""
            if [ -n "$TARGET_LANG" ] && [ "$TARGET_LANG" != "__NULL__" ]; then
              LANG_EXTRACTOR="--extractor-args youtube:lang=$TARGET_LANG"
            elif [ "$TARGET_LANG" = "__NULL__" ]; then
              # no lang argument – just rely on format filtering
              :
            fi
            echo "   🎤 Resolved lang: $TARGET_LANG (extractor arg: ${LANG_EXTRACTOR:-none})"

            # ─── Build format selector ───
            if [ "$type" = "v" ]; then
              height_val="$val"
              case "$height_val" in 2k) height_val=1440 ;; 4k) height_val=2160 ;; esac

              best_video=$(echo "$video_json" | jq -r --argjson h "$height_val" '
                [.formats[] | select(.vcodec != "none" and (.height // 0) <= $h)] |
                sort_by(.height, .tbr) | last | .format_id // ""
              ')

              # Audio selection respecting language
              audio_filter=""
              if [ -n "$TARGET_LANG" ] && [ "$TARGET_LANG" != "__NULL__" ]; then
                audio_filter="select(.vcodec==\"none\" and .acodec!=\"none\" and .language == \"$TARGET_LANG\")"
              elif [ "$TARGET_LANG" = "__NULL__" ]; then
                audio_filter="select(.vcodec==\"none\" and .acodec!=\"none\" and (.language == null or .language == \"\"))"
              else
                audio_filter="select(.vcodec==\"none\" and .acodec!=\"none\")"
              fi

              best_audio=$(echo "$video_json" | jq -r "[.formats[] | $audio_filter] | sort_by(.tbr) | last | .format_id // \"\"")
              # Fallback if no audio matches the language filter
              if [ -z "$best_audio" ] && [ -n "$TARGET_LANG" ]; then
                echo "   ⚠️  No audio for lang=$TARGET_LANG, falling back to best overall"
                best_audio=$(echo "$video_json" | jq -r '[.formats[] | select(.vcodec=="none" and .acodec!="none")] | sort_by(.tbr) | last | .format_id // ""')
              fi

              if [ -z "$best_video" ] || [ -z "$best_audio" ]; then
                echo "❌ Could not find video+audio formats"; FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [$entry]"); continue
              fi

              fmt="${best_video}+${best_audio}"
              actual_height=$(echo "$video_json" | jq -r --arg fid "$best_video" '.[.formats[] | select(.format_id==$fid)][0].height // ""')
              fps_info=$(echo "$video_json" | jq -r --arg fid "$best_video" '.[.formats[] | select(.format_id==$fid)][0].fps // ""')
              output_template="$OUTPUT_FOLDER/%(title)s-${actual_height}p${fps_info}.%(ext)s"
              echo "   📹 Video: $fmt (${actual_height}p${fps_info})"
            else
              # Audio‑only
              audio_filter=""
              if [ -n "$TARGET_LANG" ] && [ "$TARGET_LANG" != "__NULL__" ]; then
                audio_filter="select(.vcodec==\"none\" and .acodec!=\"none\" and .language == \"$TARGET_LANG\")"
              elif [ "$TARGET_LANG" = "__NULL__" ]; then
                audio_filter="select(.vcodec==\"none\" and .acodec!=\"none\" and (.language == null or .language == \"\"))"
              else
                audio_filter="select(.vcodec==\"none\" and .acodec!=\"none\")"
              fi

              audio_formats=$(echo "$video_json" | jq "[.formats[] | $audio_filter]")
              if [ "$(echo "$audio_formats" | jq length)" -eq 0 ] && [ -n "$TARGET_LANG" ]; then
                echo "   ⚠️  No audio for lang=$TARGET_LANG, falling back to best overall"
                audio_formats=$(echo "$video_json" | jq '[.formats[] | select(.vcodec=="none" and .acodec!="none")]')
              fi
              if [ "$(echo "$audio_formats" | jq length)" -eq 0 ]; then
                echo "❌ No audio formats at all"; FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [$entry]"); continue
              fi

              bitrate="$val"
              chosen=$(echo "$audio_formats" | jq -r --argjson br "$bitrate" '
                map({br: (.abr // .tbr), fid: .format_id}) |
                map({br, fid, d: (.br - $br | abs)}) |
                sort_by(.d, .br) | first | "\(.fid) \(.br)"
              ')
              fmt=$(echo "$chosen" | awk '{print $1}')
              abr_info=$(echo "$chosen" | awk '{print $2}')
              output_template="$OUTPUT_FOLDER/%(title)s-${abr_info}kbps.%(ext)s"
              echo "   🎵 Audio: $fmt (${abr_info}kbps)"
            fi

            # Download
            YT_ARGS="$COOKIE_ARGS --js-runtimes deno --remote-components ejs:npm --no-progress $LANG_EXTRACTOR"
            if ! yt-dlp $YT_ARGS -f "$fmt" -o "$output_template" "$link"; then
              echo "❌ Primary download failed"
              FAILED_ENTRIES=$(echo "$FAILED_ENTRIES" | jq ". + [$entry]")
            else
              echo "   ✅ Success"
            fi
          done

          echo "FAILED_ENTRIES_JSON=$(echo "$FAILED_ENTRIES" | jq -c .)" >> $GITHUB_OUTPUT
          echo "USER_LANG=$USER_LANG" >> $GITHUB_OUTPUT
          echo "📊 Primary done – failures: $(echo "$FAILED_ENTRIES" | jq length)"

      # ════════════════════════════════════════════════════════
      #  FALLBACK PIPELINES (12 strategies)
      # ════════════════════════════════════════════════════════
      - name: ‘🔄 Fallback pipelines (language‑aware where possible)’
        if: steps.primary_download.outputs.FAILED_ENTRIES_JSON != '[]'
        run: |
          set -e
          FAILED_ENTRIES='${{ steps.primary_download.outputs.FAILED_ENTRIES_JSON }}'
          USER_LANG='${{ steps.primary_download.outputs.USER_LANG }}'
          count=$(echo "$FAILED_ENTRIES" | jq length)
          echo "🔄 Fallback for $count entries (user lang=$USER_LANG)"

          OUTPUT_FOLDER="youtube"

          build_suffix() { [ "$1" = "a" ] && echo "${2}kbps" || echo "${2}p"; }

          # Fallback helpers (1‑11 unchanged except 12 now language‑aware)
          fallback_ytdlp_extractor() {
            echo "[FB1] yt-dlp Android"
            local suf=$(build_suffix "$2" "$3")
            yt-dlp --cookies youtube-cookies.txt --extractor-args "youtube:player_client=android" \
                   --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          fallback_ytdlp_ios() {
            echo "[FB2] yt-dlp iOS"
            local suf=$(build_suffix "$2" "$3")
            yt-dlp --cookies youtube-cookies.txt --extractor-args "youtube:player_client=ios" \
                   --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          fallback_ytdlp_nocookies() {
            echo "[FB3] yt-dlp no cookies"
            local suf=$(build_suffix "$2" "$3")
            yt-dlp --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          fallback_youtube_dl() {
            echo "[FB4] youtube-dl"
            local suf=$(build_suffix "$2" "$3")
            youtube-dl --no-progress -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          fallback_pytube_max() {
            echo "[FB5] pytube max"
            python3 -c "
          import sys, os
          from pytube import YouTube
          url = sys.argv[1]
          typ = sys.argv[2]
          val = sys.argv[3]
          suf = f'{val}kbps' if typ == 'a' else f'{val}p'
          yt = YouTube(url)
          stream = yt.streams.get_audio_only() if typ == 'a' else yt.streams.get_highest_resolution()
          out = stream.download(output_path='$OUTPUT_FOLDER')
          base, ext = os.path.splitext(out)
          os.rename(out, f'{base}_{suf}{ext}')
          " "$1" "$2" "$3"
          }
          fallback_pytube_res() {
            echo "[FB6] pytube res"
            python3 -c "
          import sys, os
          from pytube import YouTube
          url = sys.argv[1]
          target_res = int(sys.argv[2])
          suf = f'{target_res}p'
          yt = YouTube(url)
          streams = yt.streams.filter(progressive=True, res=f'{target_res}p')
          if not streams: streams = yt.streams.filter(adaptive=True, res=f'{target_res}p')
          stream = streams.first() if streams else yt.streams.get_highest_resolution()
          out = stream.download(output_path='$OUTPUT_FOLDER')
          base, ext = os.path.splitext(out)
          os.rename(out, f'{base}_{suf}{ext}')
          " "$1" "$3"
          }
          fallback_thirdparty_api1() {
            echo "[FB7] loader.to"
            local suf=$(build_suffix "$2" "$3")
            API_URL="https://loader.to/ajax/download.php?format=best&url=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$1'))")"
            resp=$(curl -s "$API_URL")
            dlink=$(echo "$resp" | jq -r '.link? // empty')
            [ -n "$dlink" ] && wget -O "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$dlink" || return 1
          }
          fallback_thirdparty_api2() {
            echo "[FB8] api.vevioz.com"
            local suf=$(build_suffix "$2" "$3")
            API_URL="https://api.vevioz.com/apis/downloader?url=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$1'))")"
            resp=$(curl -s "$API_URL")
            dlink=$(echo "$resp" | jq -r '.download_url? // empty')
            [ -n "$dlink" ] && wget -O "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$dlink" || return 1
          }
          fallback_cobalt() {
            echo "[FB9] cobalt.tools"
            local suf=$(build_suffix "$2" "$3")
            API_URL="https://api.cobalt.tools/api/json"
            payload='{"url":"'"$1"'","vCodec":"h264","aFormat":"mp3","videoQuality":"720"}'
            resp=$(curl -s -H "Content-Type: application/json" -d "$payload" "$API_URL")
            dlink=$(echo "$resp" | jq -r '.url? // empty')
            [ -n "$dlink" ] && wget -O "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$dlink" || return 1
          }
          fallback_force_ipv4() {
            echo "[FB10] yt-dlp forced IPv4"
            local suf=$(build_suffix "$2" "$3")
            yt-dlp --force-ipv4 --retries 10 --fragment-retries 10 --cookies youtube-cookies.txt \
                   --js-runtimes deno --remote-components ejs:npm --no-progress \
                   -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$1"
          }
          fallback_ytmp3_api() {
            echo "[FB11] ytmp3.gg"
            local type="$2"; local val="$3"
            FORMAT="mp4"; QUALITY="720p"
            if [ "$type" = "a" ]; then
              FORMAT="mp3"; QUALITY="${val:-192}kbps"
            else
              QUALITY="${val:-720}p"
            fi
            python3 << 'PYEOF'
          import os, sys, time, re, requests
          URL = os.environ['FB_URL']; FMT = os.environ['FB_FMT']; QUAL = os.environ['FB_QUAL']
          is_audio = FMT == 'mp3'
          if is_audio: QUAL = QUAL if QUAL in ('64kbps','128kbps','192kbps','320kbps') else '192kbps'
          else: QUAL = QUAL if QUAL in ('720p','1080p') else '720p'
          payload = {"url": URL, "os": "linux", "output": {"type": "audio" if is_audio else "video", "format": FMT}}
          if is_audio: payload["audio"] = {"bitrate": QUAL}
          else: payload["output"]["quality"] = QUAL
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0"})
          s.get("https://media.ytmp3.gg/")
          resp = s.post("https://hub.ytconvert.org/api/download", json=payload, timeout=30)
          resp.raise_for_status()
          data = resp.json()
          status_url = data['statusUrl']; title = data.get('title','video')
          dl_url = None
          for _ in range(150):
              time.sleep(2)
              r = s.get(status_url, timeout=20)
              st = r.json()
              if st.get('status') == 'completed': dl_url = st.get('downloadUrl'); break
              if st.get('status') == 'failed': print("::error::Server failed"); sys.exit(1)
          if not dl_url: print("::error::No download link"); sys.exit(1)
          vid = re.search(r'(?:v=|youtu\.be/)([a-zA-Z0-9_-]{11})', URL).group(1)
          clean = re.sub(r'[^a-zA-Z0-9\-_()\[\]]', '_', title.replace(' ','_'))
          clean = re.sub(r'_+', '_', clean).strip('_')[:70] or vid
          fname = f"{clean}_{vid}_{QUAL}.{FMT}"
          with open('.download_info','w',encoding='utf-8') as f: f.write(f"{dl_url}\n{fname}\n{title}")
          PYEOF
            DL_URL=$(head -1 .download_info); FILENAME=$(sed -n '2p' .download_info)
            echo "   🌐 ytmp3.gg: $FILENAME"
            curl -L --fail --progress-bar -o "$OUTPUT_FOLDER/$FILENAME" "$DL_URL"
            [ -s "$OUTPUT_FOLDER/$FILENAME" ] || return 1
          }

          # ─── Fallback 12: yt-dlp advanced WITH language detection ───
          fallback_ytdlp_advanced() {
            echo "[FB12] yt-dlp advanced + language"
            local link="$1"; local type="$2"; local val="$3"
            local suf=$(build_suffix "$type" "$val")

            # Re‑fetch JSON to determine original language
            local json=$(yt-dlp --cookies youtube-cookies.txt --js-runtimes deno --remote-components ejs:npm -j "$link" 2>/dev/null || true)
            if [ -z "$json" ]; then
              echo "   ⚠️  Could not fetch info for FB12 – doing basic download"
              yt-dlp --js-runtimes deno --newline --concurrent-fragments 4 \
                     -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$link"
              return
            fi

            local original_lang=$(echo "$json" | jq -r '.language // ""')
            [ "$original_lang" = "null" ] && original_lang=""

            # Resolve target language (same logic as primary)
            local target_lang=""
            if [ "$USER_LANG" = "original" ]; then
              target_lang="$original_lang"
              if [ -z "$target_lang" ]; then
                local null_count=$(echo "$json" | jq '[.formats[] | select(.vcodec=="none" and .acodec!="none" and .language==null)] | length')
                [ "$null_count" -gt 0 ] && target_lang="__NULL__" || target_lang=""
              fi
            else
              target_lang="$USER_LANG"
            fi

            local lang_arg=""
            if [ -n "$target_lang" ] && [ "$target_lang" != "__NULL__" ]; then
              lang_arg="--extractor-args youtube:lang=$target_lang"
            fi
            echo "   🎤 FB12 lang: $target_lang ($lang_arg)"

            yt-dlp --js-runtimes deno --newline \
                   --extractor-args "youtube:player_client=web_music,web,tv" \
                   --concurrent-fragments 4 \
                   $COOKIE_ARGS $lang_arg \
                   -o "$OUTPUT_FOLDER/%(title)s-${suf}.%(ext)s" "$link"
          }

          FALLBACKS=(
            fallback_ytdlp_extractor
            fallback_ytdlp_ios
            fallback_ytdlp_nocookies
            fallback_youtube_dl
            fallback_pytube_max
            fallback_pytube_res
            fallback_thirdparty_api1
            fallback_thirdparty_api2
            fallback_cobalt
            fallback_force_ipv4
            fallback_ytmp3_api
            fallback_ytdlp_advanced
          )

          for ((idx=0; idx<count; idx++)); do
            entry=$(echo "$FAILED_ENTRIES" | jq ".[$idx]")
            link=$(echo "$entry" | jq -r '.link')
            args_len=$(echo "$entry" | jq '.args | length')
            type="v"; val1="720"
            [ "$args_len" -ge 1 ] && type=$(echo "$entry" | jq -r '.args[0]')
            [ "$args_len" -ge 2 ] && val1=$(echo "$entry" | jq -r '.args[1]')

            if ! echo "$link" | grep -Eq '(youtube\.com/watch\?v=|youtu\.be/)'; then continue; fi

            echo "========================================"
            echo "🔄 Fallback: $link ($type $val1)"
            success=0
            for func in "${FALLBACKS[@]}"; do
              if $func "$link" "$type" "$val1"; then
                echo "   ✅ $func succeeded"; success=1; break
              else
                echo "   ❌ $func failed"
              fi
            done
            [ $success -eq 0 ] && echo "❌ All 12 fallbacks failed"
          done
        env:
          OUTPUT_FOLDER: youtube
          FRAGMENTS: 4
          COOKIE_ARGS: ${{ steps.primary_download.outputs.COOKIE_ARGS }}

      # ════════════════════════════════════════════════════════
      #  SPLIT, PUSH, CLEANUP
      # ════════════════════════════════════════════════════════
      - name: ‘✂️  Split oversized files (>99MB)’
        run: |
          OUTPUT_FOLDER="youtube"
          THRESH_MB=99
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))
          for f in "$OUTPUT_FOLDER"/*; do
            [ -f "$f" ] || continue
            fs=$(stat -c%s "$f")
            if [ "$fs" -gt "$THRESH_BYTES" ]; then
              echo "   ✂️  Splitting $(basename "$f") ($((fs/1024/1024)) MB)"
              zip -j -s "${THRESH_MB}m" "$OUTPUT_FOLDER/$(basename "$f").zip" "$f"
              rm "$f"
            fi
          done

      - name: ‘📤 Push to repository’
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add youtube/
          git commit -m "⬇️ YouTube download [skip ci]" || echo "Nothing to commit"
          for i in {1..5}; do
            echo "🚀 Push attempt $i..."
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            if git push origin "${{ github.ref_name }}"; then
              echo "✅ Push succeeded"; break
            else
              [ $i -lt 5 ] && sleep 3 || { echo "❌ Push failed"; exit 1; }
            fi
          done

      - name: ‘🧹 Cleanup’
        if: always()
        run: rm -rf .download_info youtube-cookies.txt 2>/dev/null || true
