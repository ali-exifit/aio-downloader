name: aio-leecher

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Paste video/audio URLs (one per line, with optional shortcuts like v1080, a320)'
        required: true
      extra_args:
        description: 'Extra yt-dlp arguments (optional)'
        required: false
        default: ''

jobs:
  leech:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse input and prepare tasks
        id: parse
        run: |
          echo "📝 Reading your input..."
          INPUT="${{ github.event.inputs.urls }}"
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"
          ENTRIES="[]"
          # Process each non-empty line
          while IFS= read -r line; do
            line=$(echo "$line" | xargs)  # trim whitespace
            [ -z "$line" ] && continue
            RAW=false
            TYPE=""
            VAL1=""
            # Check if line starts with v or a followed by a number (shortcut mode)
            if echo "$line" | grep -qE '^[va][0-9]+[kp]? '; then
              TYPE=$(echo "$line" | cut -d' ' -f1 | cut -c1)
              VAL1=$(echo "$line" | cut -d' ' -f1 | cut -c2-)
              LINK=$(echo "$line" | cut -d' ' -f2-)
            else
              RAW=true
              LINK="$line"
            fi
            ENTRIES=$(echo "$ENTRIES" | jq --arg link "$LINK" --argjson raw "$RAW" --arg type "$TYPE" --arg val1 "$VAL1" \
              '. + [{"link":$link, "raw":$raw, "type":$type, "val1":$val1}]')
          done <<< "$INPUT"

          # Tell the user what we found
          COUNT=$(echo "$ENTRIES" | jq length)
          echo "🔍 Parsed $COUNT download task(s)"
          echo "$ENTRIES" | jq -r '.[] | "   📎 \(.link) (\(if .raw then "raw" else "shortcut" end) mode)"'
          echo "ENTRIES_JSON<<EOF" >> $GITHUB_OUTPUT
          echo "$ENTRIES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "EXTRA_ARGS=$EXTRA_ARGS" >> $GITHUB_OUTPUT

      - name: Install tools
        run: |
          echo "🛠️  Checking & installing helper tools..."

          if ! command -v yt-dlp &> /dev/null; then
            echo "   ⬇️  Installing yt-dlp..."
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
            chmod a+rx /usr/local/bin/yt-dlp
            echo "   ✅ yt-dlp installed"
          else
            echo "   ✅ yt-dlp already present"
          fi

          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            echo "   ⬇️  Installing jq & ffmpeg via apt..."
            sudo apt-get update -qq && sudo apt-get install -y -qq jq ffmpeg
            echo "   ✅ jq & ffmpeg ready"
          else
            echo "   ✅ jq & ffmpeg already present"
          fi

          if ! command -v deno &> /dev/null; then
            echo "   ⬇️  Installing deno..."
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
            echo "   ✅ deno installed"
          else
            echo "   ✅ deno already present"
          fi

          echo "🎉 All tools ready!"

          # yt-dlp base args
          echo "BASE_YT_DLP_ARGS='--no-warnings --no-playlist --no-check-certificate --extractor-retries 5 --fragment-retries 5 --retries 5'" >> $GITHUB_ENV

      - name: Download and process
        run: |
          set -euo pipefail
          mkdir -p leecher-content leecher

          ENTRIES_JSON='${{ steps.parse.outputs.ENTRIES_JSON }}'
          EXTRA_ARGS='${{ steps.parse.outputs.EXTRA_ARGS }}'
          TOTAL=$(echo "$ENTRIES_JSON" | jq length)

          echo "📦 Starting downloads & processing..."
          echo "   Total tasks: $TOTAL"

          # Helper functions with friendly messages
          download_with_progress() {
            local yt_args="$1"
            local output_template="$2"
            local total_size="$3"
            local url="$4"
            echo "      ⏳ Download started..."
            yt-dlp $BASE_YT_DLP_ARGS --no-progress $yt_args -o "$output_template" "$url" &
            local dl_pid=$!
            # Wait and show a simplified indicator (every 2s)
            while kill -0 $dl_pid 2>/dev/null; do
              echo -n "."
              sleep 2
            done
            wait $dl_pid
            local final_file=$(ls "$output_dir"/*.part 2>/dev/null | head -n1)
            if [ -n "$final_file" ]; then
              local final_size=$(stat -c%s "$final_file")
              echo "      ✅ Download complete: ${final_size} bytes"
            else
              echo "      ✅ Download finished"
            fi
          }

          download_audio() {
            local url="$1"
            local video_json="$2"
            local abr="$3"
            echo "   🎧 Selecting best audio format for ${abr} kbps…"
            local audio_id=$(echo "$video_json" | jq -r --arg abr "$abr" '
              [.formats[] | select(.acodec != "none" and .vcodec == "none")] |
              sort_by(-(.abr // 0)) |
              map(select((.abr // 0) <= ($abr|tonumber))) |
              first(.[].format_id // empty)')
            if [ -z "$audio_id" ] || [ "$audio_id" = "null" ]; then
              echo "   ⚠️ No audio format found for that bitrate, falling back to best audio"
              audio_id=$(echo "$video_json" | jq -r '.formats | map(select(.acodec != "none" and .vcodec == "none")) | max_by(.abr // 0).format_id')
            fi
            local output_template="leecher-content/%(title)s-${abr}kbps.%(ext)s"
            echo "   📥 Downloading audio (format $audio_id) → $output_template"
            download_with_progress "-f $audio_id $EXTRA_ARGS" "$output_template" "" "$url"
          }

          generic_download() {
            local url="$1"
            echo "   ⬇️  Trying generic download (best quality)..."
            download_with_progress "$EXTRA_ARGS" "leecher-content/%(title)s.%(ext)s" "" "$url"
          }

          for ((idx=0; idx<TOTAL; idx++)); do
            task_num=$((idx + 1))
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔽 Task ${task_num} of ${TOTAL}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            link=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].link")
            raw=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].raw")
            type=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].type")
            val1=$(echo "$ENTRIES_JSON" | jq -r ".[$idx].val1")

            echo "   🌐 URL: $link"
            if [ "$raw" = "true" ]; then
              echo "   📌 Mode: raw (full best quality)"
            else
              [ "$type" = "v" ] && echo "   📌 Mode: 📹 video (${val1})"
              [ "$type" = "a" ] && echo "   📌 Mode: 🎵 audio (${val1})"
            fi

            if [ "$raw" = "true" ]; then
              echo "   ⏳ Downloading raw (best single format)..."
              if generic_download "$link"; then
                echo "   ✅ Raw download complete"
              else
                echo "   ❌ Raw download failed, skipping"
              fi
              continue
            fi

            # For shortcuts, fetch video info first
            echo "   ⏳ Fetching metadata from YouTube..."
            video_json=$(yt-dlp -j --no-playlist "$link" 2>/dev/null || echo "")
            if [ -z "$video_json" ]; then
              echo "   ❌ Could not fetch video info; trying generic download..."
              if generic_download "$link"; then
                echo "   ✅ Generic download worked"
              else
                echo "   ❌ Generic download also failed, skipping"
              fi
              continue
            fi
            echo "   ✅ Metadata retrieved"

            if [ "$type" = "v" ]; then
              echo "   📹 Downloading best video & audio streams..."
              # Determine quality height
              desired_height=$(echo "$val1" | grep -oE '[0-9]+')
              video_id=$(echo "$video_json" | jq -r --arg h "$desired_height" '
                [.formats[] | select(.vcodec != "none" and .acodec == "none")] |
                sort_by(-(.height // 0)) |
                map(select((.height // 0) <= ($h|tonumber))) |
                first(.[].format_id // empty)')
              audio_id=$(echo "$video_json" | jq -r '
                [.formats[] | select(.acodec != "none" and .vcodec == "none")] |
                sort_by(-(.abr // 0)) |
                first(.[].format_id // empty)')
              if [ -z "$video_id" ] || [ "$video_id" = "null" ]; then
                echo "   ⚠️ No suitable video found, falling back to best"
                video_id=$(echo "$video_json" | jq -r '.formats | map(select(.vcodec != "none" and .acodec == "none")) | max_by(.height // 0).format_id')
              fi
              echo "      🎬 Video stream: format $video_id"
              echo "      🔊 Audio stream: format $audio_id"
              # Download video
              video_out="leecher-content/video.%(ext)s"
              audio_out="leecher-content/audio.%(ext)s"
              download_with_progress "-f $video_id $EXTRA_ARGS" "$video_out" "" "$link"
              download_with_progress "-f $audio_id $EXTRA_ARGS" "$audio_out" "" "$link"
              # Remux
              echo "   🔄 Remuxing into final file..."
              video_file=$(ls leecher-content/video.* 2>/dev/null | head -n1)
              audio_file=$(ls leecher-content/audio.* 2>/dev/null | head -n1)
              title=$(echo "$video_json" | jq -r '.title')
              ext=$(echo "$video_file" | rev | cut -d. -f1 | rev)
              output="leecher-content/${title}-${desired_height}p.${ext}"
              if ffmpeg -i "$video_file" -i "$audio_file" -c copy -shortest "$output" -loglevel error; then
                rm -f "$video_file" "$audio_file"
                echo "   ✅ Remux complete → $(basename "$output")"
              else
                echo "   ⚠️ Remux failed, keeping original files"
              fi
            elif [ "$type" = "a" ]; then
              echo "   🎵 Downloading audio with preferred bitrate..."
              if download_audio "$link" "$video_json" "$val1"; then
                echo "   ✅ Audio downloaded"
              else
                echo "   ⚠️ Audio download failed, trying generic download..."
                if generic_download "$link"; then
                  echo "   ✅ Generic download succeeded"
                else
                  echo "   ❌ All methods failed – skipping"
                fi
              fi
            fi
          done

      - name: Create split ZIP archive
        run: |
          echo "📦 Creating split ZIP archive (max 99 MB per part)…"
          mkdir -p leecher
          ZIPNAME="leeched-$(date +%s).zip"
          if ls leecher-content/* 1>/dev/null 2>&1; then
            cd leecher-content
            zip -j -s 99m -r "../leecher/${ZIPNAME}" *
            num_parts=$(ls ../leecher/${ZIPNAME}* 2>/dev/null | wc -l)
            echo "   ✅ Archive created: ${ZIPNAME} ($num_parts part(s))"
            cd ..
          else
            echo "   ❌ No files found to zip"
          fi

      - name: Upload to leecher folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "☁️  Uploading ZIP archive(s) to branch '${BRANCH}'…"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          FILES=(leecher/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "   ⚠️ No files to upload, exiting"
            exit 0
          fi

          git add leecher/
          git commit -m "Add leeched parts [skip ci]" || echo "   ℹ️ Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            if git push origin "$BRANCH"; then
              echo "   ✅ Push succeeded on attempt ${i}!"
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "   ⚠️ Push attempt ${i} failed; retrying in 3 seconds…"
                sleep 3
              else
                echo "   ❌ Push failed after $RETRIES attempts"
                exit 1
              fi
            fi
          done

          echo "🎉 All files uploaded!"
