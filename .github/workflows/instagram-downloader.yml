---
name: instagram-downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Instagram URLs – separate by comma, space, or newline'
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ---------- extract URLs from input ----------
      - name: Parse input and extract URLs
        id: parse
        run: |
          INPUT="${{ github.event.inputs.urls }}"
          # Remove surrounding quotes (if any) and extract all Instagram URLs
          CLEANED=$(echo "$INPUT" | tr -d '"'\')
          # Match http/https Instagram links, stop at whitespace/comma/semicolon
          URLS=$(echo "$CLEANED" | grep -oP 'https?://(www\.)?instagram\.com/[^\s,;]+' | sort -u)
          if [ -z "$URLS" ]; then
            echo "ERROR: No Instagram URLs found in the input."
            exit 1
          fi
          echo "$URLS" > urls.txt
          echo "Found $(wc -l < urls.txt) URL(s) to download."

      # ---------- cache & install tools ----------
      - name: Restore cached tools
        uses: actions/cache@v4
        id: tool-cache
        with:
          path: |
            ~/.local/bin/yt-dlp      # kept for potential fallback, but not used now
            ~/.deno
          key: fetch-tools-${{ runner.os }}-v2

      - name: Add cached tools to PATH
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install tools
        run: |
          # gallery-dl (primary downloader for Instagram)
          if ! command -v gallery-dl &> /dev/null; then
            pip install gallery-dl
          fi

          # yt-dlp (optional, not used for Instagram anymore)
          if ! command -v yt-dlp &> /dev/null; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
            chmod a+rx ~/.local/bin/yt-dlp
          fi

          # jq & ffmpeg
          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq ffmpeg
          fi

          # Deno (optional, kept for consistency)
          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
            echo "$HOME/.deno/bin" >> $GITHUB_PATH
          fi

      # ---------- download all Instagram URLs with gallery-dl ----------
      - name: Download Instagram content
        run: |
          mkdir -p instagram_downloads
          COOKIES_FILE="instagram-cookies.txt"

          # Build gallery-dl arguments
          GALLERY_DL_ARGS=""
          if [ -f "$COOKIES_FILE" ]; then
            GALLERY_DL_ARGS="$GALLERY_DL_ARGS --cookies $COOKIES_FILE"
          fi

          # gallery-dl reads URLs from a file; -d sets the download destination
          gallery-dl $GALLERY_DL_ARGS \
                     --input-file urls.txt \
                     -d "instagram_downloads" \
                     --verbose

          echo "Downloads finished. Contents:"
          ls -lhR instagram_downloads/

      # ---------- remux videos for compatibility (adjusted for subdirs) ----------
      - name: Remux videos (if needed)
        run: |
          # gallery-dl may place video files inside subfolders – use find
          find instagram_downloads -type f \( -iname "*.mp4" -o -iname "*.webm" -o -iname "*.mkv" \) | while read -r f; do
            echo "Processing $f"
            FIXED="${f%/*}/fixed_${f##*/}"
            ffmpeg -i "$f" -c copy "$FIXED" -y && mv "$FIXED" "$f" || echo "Remux failed for $f, keeping original."
          done

      # ---------- create ZIP with internal "instagram/" folder ----------
      - name: Create ZIP archive
        id: zip
        run: |
          # Prepare zip contents with a top-level instagram/ folder
          rm -rf zipcontent
          mkdir -p zipcontent/instagram
          cp -r instagram_downloads/* zipcontent/instagram/

          # Generate a timestamped zip name
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ZIP_NAME="instagram-contents-${TIMESTAMP}.zip"

          cd zipcontent
          # Split at 99 MB to stay under GitHub’s file size limit
          zip -s 99m -r "../${ZIP_NAME}" "instagram"
          cd ..

          # Move the resulting zip (and its parts) into the instagram/ folder
          mkdir -p instagram
          mv ${ZIP_NAME}* instagram/

          echo "Created archive(s):"
          ls -lh instagram/

      # ---------- upload to repository ----------
      - name: Upload to 'instagram' folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ ! -d "instagram" ] || [ -z "$(ls -A instagram)" ]; then
            echo "Nothing to upload."
            exit 0
          fi

          git add instagram/
          git commit -m "Add Instagram batch download [skip ci]" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "Push rejected, retrying in 3 seconds..."
                sleep 3
              else
                echo "Push failed after $RETRIES attempts."
                exit 1
              fi
            fi
          done
          echo "All files uploaded to the 'instagram' folder."
