name: instagram-downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Enter one or more Instagram URLs (comma separated)'
        required: true
        default: ''

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Cache pip dependencies to speed up yt-dlp installation
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install yt-dlp and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg
          pip3 install --quiet --upgrade yt-dlp

      - name: Parse URLs and download media
        id: download
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          WORK_DIR="instagram_batch_${TIMESTAMP}"
          mkdir -p "$WORK_DIR"

          # Create the inner folder that will appear inside the zip
          INNER_FOLDER="content-downloaded-${TIMESTAMP}"
          mkdir -p "$WORK_DIR/$INNER_FOLDER"

          IFS=',' read -ra URL_ARRAY <<< "${{ github.event.inputs.urls }}"
          echo "Found ${#URL_ARRAY[@]} URL(s) to process."

          for url in "${URL_ARRAY[@]}"; do
            url=$(echo "$url" | xargs)
            echo "Downloading: $url"
            # Download directly into the inner folder
            yt-dlp -o "$WORK_DIR/$INNER_FOLDER/%(title)s_%(id)s.%(ext)s" \
                   --no-playlist \
                   --ignore-errors \
                   --restrict-filenames \
                   "$url" || echo "Warning: failed to download $url"
            sleep 2
          done

          FILE_COUNT=$(find "$WORK_DIR/$INNER_FOLDER" -type f | wc -l)
          echo "Downloaded $FILE_COUNT file(s) to $WORK_DIR/$INNER_FOLDER"

          if [ $FILE_COUNT -eq 0 ]; then
            echo "No files were downloaded. Exiting."
            exit 1
          fi

          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_OUTPUT
          echo "INNER_FOLDER=$INNER_FOLDER" >> $GITHUB_OUTPUT
          echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_OUTPUT

      - name: Create split zip archive (with folder structure)
        run: |
          WORK_DIR="${{ steps.download.outputs.WORK_DIR }}"
          INNER_FOLDER="${{ steps.download.outputs.INNER_FOLDER }}"
          mkdir -p instagram

          cd "$WORK_DIR"
          # Zip the inner folder so that the archive contains "content-downloaded-<timestamp>/"
          # The split parts will be placed in ../instagram/
          zip -s 99m "../instagram/instagram_media.zip" -r "$INNER_FOLDER"
          cd ..

          echo "Split zip parts created in instagram/:"
          ls -lh instagram/instagram_media.*

      - name: Commit and push to repository
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ -z "$(ls -A instagram/)" ]; then
            echo "No files to upload."
            exit 0
          fi

          git add instagram/
          git commit -m "Add Instagram batch download (${{ steps.download.outputs.FILE_COUNT }} files) [skip ci]" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                sleep 3
              else
                exit 1
              fi
            fi
          done

      - name: Cleanup temporary directory
        if: always()
        run: |
          rm -rf "${{ steps.download.outputs.WORK_DIR }}"
