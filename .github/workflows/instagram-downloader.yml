name: instagram-downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Enter one or more Instagram URLs (comma separated)'
        required: true
        default: 'https://www.instagram.com/reel/DVYzkSFEV_M/,https://www.instagram.com/p/DX6US4uCNGb/'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ── Cache yt-dlp and Deno (like youtube-downloader) ─────────────
      - name: Restore cached tools
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/yt-dlp
            ~/.deno
          key: fetch-tools-${{ runner.os }}-v1

      - name: Add cached tools to PATH
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install tools (yt-dlp + deno + ffmpeg)
        run: |
          # yt-dlp
          if ! command -v yt-dlp &> /dev/null; then
            curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
            chmod a+rx ~/.local/bin/yt-dlp
          fi

          # jq & ffmpeg (needed for some Instagram formats)
          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq ffmpeg
          fi

          # Deno (required by yt-dlp for Instagram extractor)
          if ! command -v deno &> /dev/null; then
            curl -fsSL https://deno.land/install.sh | sh -s -- -y
            echo "$HOME/.deno/bin" >> $GITHUB_PATH
          fi

      - name: Download Instagram media (batch)
        id: download
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          WORK_DIR="instagram_batch_${TIMESTAMP}"
          INNER_FOLDER="content-downloaded-${TIMESTAMP}"
          mkdir -p "$WORK_DIR/$INNER_FOLDER"

          # Split input URLs by comma
          IFS=',' read -ra URL_ARRAY <<< "${{ github.event.inputs.urls }}"
          echo "Found ${#URL_ARRAY[@]} URL(s) to process."

          # yt-dlp common args (use cookies.txt if you have one, otherwise comment out --cookies)
          YT_DLP_ARGS="--js-runtimes deno --remote-components ejs:npm --no-progress --ignore-errors"

          for url in "${URL_ARRAY[@]}"; do
            url=$(echo "$url" | xargs)
            echo "Downloading: $url"
            yt-dlp $YT_DLP_ARGS \
              -o "$WORK_DIR/$INNER_FOLDER/%(title)s_%(id)s.%(ext)s" \
              --no-playlist \
              --restrict-filenames \
              "$url" || echo "Warning: failed to download $url"
            sleep 2
          done

          FILE_COUNT=$(find "$WORK_DIR/$INNER_FOLDER" -type f | wc -l)
          echo "Downloaded $FILE_COUNT file(s) to $WORK_DIR/$INNER_FOLDER"

          if [ $FILE_COUNT -eq 0 ]; then
            echo "No files were downloaded. Exiting."
            exit 1
          fi

          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_OUTPUT
          echo "INNER_FOLDER=$INNER_FOLDER" >> $GITHUB_OUTPUT
          echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_OUTPUT

      - name: Create split zip archive (inside instagram/ folder)
        run: |
          WORK_DIR="${{ steps.download.outputs.WORK_DIR }}"
          INNER_FOLDER="${{ steps.download.outputs.INNER_FOLDER }}"
          mkdir -p instagram

          cd "$WORK_DIR"
          # Zip the inner folder so that it appears as "content-downloaded-<timestamp>/" when unzipped
          zip -s 99m "../instagram/instagram_media.zip" -r "$INNER_FOLDER"
          cd ..

          echo "Split zip parts created in instagram/:"
          ls -lh instagram/instagram_media.*

      - name: Commit and push to repository
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ -z "$(ls -A instagram/)" ]; then
            echo "No files to upload."
            exit 0
          fi

          git add instagram/
          git commit -m "Add Instagram batch download (${{ steps.download.outputs.FILE_COUNT }} files) [skip ci]" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                sleep 3
              else
                exit 1
              fi
            fi
          done

      - name: Cleanup temporary directory
        if: always()
        run: |
          rm -rf "${{ steps.download.outputs.WORK_DIR }}"
