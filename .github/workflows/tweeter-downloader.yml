---
name: twitter-downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Twitter/X URLs – separate by comma, space, or newline'
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse input and extract URLs
        id: parse
        run: |
          INPUT="${{ github.event.inputs.urls }}"
          CLEANED=$(echo "$INPUT" | tr -d '"'\')
          URLS=$(echo "$CLEANED" | grep -oP 'https?://(www\.)?(twitter|x)\.com/[^\s,;]+' | sort -u)
          if [ -z "$URLS" ]; then
            echo "ERROR: No Twitter/X URLs found."
            exit 1
          fi
          echo "$URLS" > urls.txt
          echo "Found $(wc -l < urls.txt) URL(s) to download."

      - name: Write cookies from secrets
        run: |
          if [ -n "$TWITTER_COOKIES" ]; then
            echo "$TWITTER_COOKIES" > twitter-cookies.txt
            echo "Twitter cookies written."
          else
            echo "No TWITTER_COOKIES secret found – proceeding without login."
          fi
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}

      - name: Restore cached tools
        uses: actions/cache@v4
        id: tool-cache
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: fetch-tools-${{ runner.os }}-v4

      - name: Install tools
        run: |
          pip install gallery-dl
          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq ffmpeg
          fi

          # Install puppeteer locally (skip Chromium download – use system Chromium)
          PUPPETEER_SKIP_DOWNLOAD=true npm install puppeteer

      - name: Download attached media (no JSON)
        run: |
          mkdir -p twitter_downloads

          GALLERY_DL_ARGS=""
          if [ -f "twitter-cookies.txt" ]; then
            GALLERY_DL_ARGS="$GALLERY_DL_ARGS --cookies twitter-cookies.txt"
          fi

          gallery-dl $GALLERY_DL_ARGS \
                     --input-file urls.txt \
                     -d "twitter_downloads" \
                     --verbose

          echo "Media downloads finished. Contents:"
          ls -lhR twitter_downloads/

      - name: Screenshot tweets as images (with full threads)
        run: |
          CHROMIUM_PATH=$(which chromium-browser || which chromium || which google-chrome-stable || echo "/usr/bin/chromium-browser")
          echo "Using Chromium at: $CHROMIUM_PATH"

          cat > screenshot-tweets.mjs << 'EOF'
          import puppeteer from 'puppeteer';
          import fs from 'fs';
          import path from 'path';
          import { fileURLToPath } from 'url';

          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          const urls = fs.readFileSync('urls.txt', 'utf8').trim().split(/\r?\n/).filter(Boolean);
          const outputBase = 'twitter_downloads/twitter';
          const cookieFile = 'twitter-cookies.txt';
          const chromePath = process.env.CHROMIUM_PATH || '/usr/bin/chromium-browser';

          const browser = await puppeteer.launch({
            executablePath: chromePath,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
          });

          const context = browser.defaultBrowserContext();
          if (fs.existsSync(cookieFile)) {
            const cookiesText = fs.readFileSync(cookieFile, 'utf8').trim();
            if (cookiesText) {
              const cookies = cookiesText.split('\n')
                .filter(line => !line.startsWith('#') && line.trim())
                .map(line => {
                  const parts = line.split('\t');
                  if (parts.length < 7) return null;
                  return {
                    name: parts[5],
                    value: parts[6],
                    domain: parts[0],
                    path: parts[2],
                    httpOnly: false,
                    secure: parts[1] === 'TRUE'
                  };
                })
                .filter(Boolean);
              if (cookies.length) await context.setCookies(cookies);
            }
          }

          for (const url of urls) {
            const match = url.match(/(?:twitter|x)\.com\/([^/]+)/);
            const username = match ? match[1] : 'unknown';
            const userDir = path.join(outputBase, username);
            fs.mkdirSync(userDir, { recursive: true });

            const tweetIdMatch = url.match(/status\/(\d+)/);
            const tweetId = tweetIdMatch ? tweetIdMatch[1] : 'unknown';
            const outputFile = path.join(userDir, `${username}_${tweetId}_tweet.png`);

            console.log(`Screenshotting: ${url}`);
            const page = await browser.newPage();
            await page.setViewport({ width: 600, height: 900 });
            await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });

            await page.waitForSelector('article[data-testid="tweet"]', { timeout: 15000 }).catch(() =>
              console.log('Warning: tweet container not found')
            );

            // Expand full thread if "Show this thread" is present
            const showThreadSelector = 'a[href*="/status/"][role="link"] span';
            try {
              const showThreadBtn = await page.waitForSelector(showThreadSelector, { timeout: 3000 });
              if (showThreadBtn) {
                const text = await page.evaluate(el => el.textContent, showThreadBtn);
                if (text && text.includes('Show this thread')) {
                  console.log('→ Clicked "Show this thread"');
                  await showThreadBtn.click();
                  await page.waitForTimeout(2000);
                  await page.waitForNetworkIdle({ idleTime: 1000, timeout: 10000 }).catch(() => {});
                }
              }
            } catch (_) { /* no "Show this thread" link – that's fine */ }

            await page.screenshot({ path: outputFile, fullPage: true });
            console.log(`Saved: ${outputFile}`);
            await page.close();
          }

          await browser.close();
          console.log('All screenshots taken.');
          EOF

          export CHROMIUM_PATH="$CHROMIUM_PATH"
          node screenshot-tweets.mjs

      - name: Create ZIP archive (split into 99 MB parts, unique name)
        id: zip
        run: |
          mv twitter_downloads/twitter/* twitter_downloads/ 2>/dev/null || true
          rmdir twitter_downloads/twitter 2>/dev/null || true

          mkdir -p twitter
          RANDSTR=$(uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '-' | head -c 8)
          ZIP_NAME="twitter-contents-${RANDSTR}.zip"
          echo "Archive base name: ${ZIP_NAME}"

          zip -s 99m -r "twitter/${ZIP_NAME}" twitter_downloads/

          echo "Created archive parts:"
          ls -lh twitter/

      - name: Upload to 'twitter' folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ ! -d "twitter" ] || [ -z "$(ls -A twitter)" ]; then
            echo "Nothing to upload."
            exit 0
          fi

          git add twitter/
          git commit -m "Add Twitter batch download [skip ci]" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "Push rejected, retrying in 3 seconds..."
                sleep 3
              else
                echo "Push failed after $RETRIES attempts."
                exit 1
              fi
            fi
          done
          echo "All files uploaded to the 'twitter' folder."
