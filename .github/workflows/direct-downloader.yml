name: direct-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          Enter one or more Direct Download URLs.
          Separate by commas, spaces, or newlines.
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Parse URLs
        id: parse
        run: |
          URLS_INPUT="${{ github.event.inputs.url }}"
          # Replace commas and newlines with spaces, then clean up
          URLS=$(echo "$URLS_INPUT" | tr ',' ' ' | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//;s/ *$//')
          if [ -z "$URLS" ]; then
            echo "❌ No URLs provided." >&2
            exit 1
          fi
          echo "$URLS" | tr ' ' '\n' > urls.txt
          echo "✅ Parsed URLs:"
          cat urls.txt
          NUM=$(wc -l < urls.txt)
          echo "🔢 Total URLs to process: $NUM"
          echo "NUM_URLS=$NUM" >> $GITHUB_OUTPUT

      - name: Download and zip each file
        run: |
          mkdir -p direct
          total=$(wc -l < urls.txt)
          index=0
          success_count=0
          fail_count=0
          failed_urls=""
          echo "⏬ Starting downloads for $total URL(s)..."

          while IFS= read -r url; do
            index=$((index + 1))
            echo ""
            echo "=============================="
            echo "📦 Processing URL $index of $total"
            echo "🌐 $url"
            echo "=============================="

            # Create a unique temporary download folder
            DL_DIR="dl_$index"
            mkdir -p "$DL_DIR"

            echo "📥 Downloading..."
            if ! aria2c -x 16 -s 16 -d "$DL_DIR" --console-log-level=warn --summary-interval=10 "$url"; then
              echo "❌ Download failed for this URL. Skipping to the next one."
              rm -rf "$DL_DIR"
              fail_count=$((fail_count + 1))
              failed_urls="$failed_urls\n  [$index] $url"
              continue
            fi
            echo "✅ Download completed."

            # Identify the downloaded file
            DL_FILE=$(ls -1 "$DL_DIR" | head -n1)
            if [ -z "$DL_FILE" ]; then
              echo "❌ Could not find the downloaded file. Skipping."
              rm -rf "$DL_DIR"
              fail_count=$((fail_count + 1))
              failed_urls="$failed_urls\n  [$index] $url"
              continue
            fi
            echo "📄 Downloaded file: $DL_FILE"

            # Generate a random 5‑letter suffix and final zip name
            RAND5=$(tr -dc 'a-z' </dev/urandom | head -c5)
            ZIP_BASE="${DL_FILE}_${RAND5}"
            ZIP_NAME="${ZIP_BASE}.zip"
            echo "🎲 Random suffix added: $RAND5"
            echo "📦 ZIP output name: $ZIP_NAME"

            # Prepare a temporary directory for zipping
            TMPZIP="tmpzip_$index"
            mkdir -p "$TMPZIP"
            cp "$DL_DIR/$DL_FILE" "$TMPZIP/"

            echo "🗜️ Creating split ZIP archive (99 MB parts)..."
            if ! (cd "$TMPZIP" && zip -s 99m "../direct/${ZIP_NAME}" "$DL_FILE"); then
              echo "❌ Zipping failed. Skipping this URL."
              rm -rf "$DL_DIR" "$TMPZIP"
              fail_count=$((fail_count + 1))
              failed_urls="$failed_urls\n  [$index] $url"
              continue
            fi
            echo "✅ ZIP created: ${ZIP_NAME} (and split parts if any)"

            # Clean up temporary folders
            rm -rf "$DL_DIR" "$TMPZIP"
            success_count=$((success_count + 1))
            echo "🎉 URL $index processed successfully!"

          done < urls.txt

          # Final summary
          echo ""
          echo "=================================="
          echo "📊 DOWNLOAD SUMMARY"
          echo "=================================="
          echo "✅ Successfully processed: $success_count URL(s)"
          echo "❌ Failed: $fail_count URL(s)"
          if [ $fail_count -gt 0 ]; then
            echo "🔻 Failed URLs:"
            echo -e "$failed_urls"
          fi
          echo "=================================="

          - name: Upload to direct folder
            env:
              BRANCH: ${{ github.ref_name }}
            run: |
              # --- early exit if nothing to upload ---
              if [ -z "$(ls -A direct/)" ]; then
                echo "📭 No files to upload (all downloads failed or produced no output)."
                exit 0
              fi
          
              echo "📤 Relentless upload & verification for direct/ folder..."
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              git config http.postBuffer 524288000
          
              # Build commit message
              COMMIT_MSG="Add: $(ls -1 direct/ | tr '\n' ' ' | sed 's/ *$//') [skip ci]"
          
              MAX_ATTEMPTS=10
              attempt=1
          
              while [ $attempt -le $MAX_ATTEMPTS ]; do
                echo ""
                echo "--- Attempt $attempt of $MAX_ATTEMPTS ---"
          
                git add direct/
          
                # Only commit if something is staged
                if ! git diff --cached --quiet; then
                  git commit -m "$COMMIT_MSG"
                else
                  echo "Nothing new to commit, will still ensure remote is in sync."
                fi
          
                # --- 1. Sync with remote, always favouring our local files ---
                echo "→ Syncing with remote (rebase -X ours)..."
                if ! git pull --rebase -X ours origin "$BRANCH"; then
                  echo "⚠ Rebase failed – unexpected, retrying..."
                  sleep 3
                  attempt=$((attempt + 1))
                  continue
                fi
          
                # --- 2. Push (fast-forward only) ---
                echo "→ Pushing to origin/$BRANCH..."
                if ! git push origin "$BRANCH"; then
                  echo "⚠ Push failed – remote may have moved. Retrying in 5 seconds..."
                  sleep 5
                  attempt=$((attempt + 1))
                  continue
                fi
          
                echo "✅ Push accepted. Now verifying remote state..."
          
                # --- 3. Verification ---
                # Fetch the latest branch to inspect the remote tree
                git fetch origin "$BRANCH" --depth=1
          
                # List all files in the remote 'direct/' directory (recursively)
                REMOTE_FILES=$(git ls-tree -r --name-only "origin/$BRANCH" -- direct/ | sort)
          
                # List all files that are locally present in 'direct/' (recursively)
                LOCAL_FILES=$(find direct/ -type f | sort)
          
                if [ "$REMOTE_FILES" = "$LOCAL_FILES" ]; then
                  echo "🎯 Verification successful – all files are present in the remote 'direct/' folder."
                  exit 0
                else
                  echo "❌ Mismatch – remote content does not match local:"
                  echo "  Remote files:"
                  echo "$REMOTE_FILES" | sed 's/^/    /'
                  echo "  Local files:"
                  echo "$LOCAL_FILES" | sed 's/^/    /'
                  echo "Retrying the whole process..."
                fi
          
                attempt=$((attempt + 1))
                sleep 3
              done
          
              echo "💀 Failed to upload and verify after $MAX_ATTEMPTS attempts."
              exit 1
