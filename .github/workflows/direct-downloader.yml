---
name: direct-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Enter one or more Direct Download URLs (comma, space, or newline separated)'
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Download Files (aria2)
        id: dl
        run: |
          URLS_INPUT="${{ github.event.inputs.url }}"
          # Replace commas and newlines with spaces, then trim
          URLS=$(echo "$URLS_INPUT" | tr ',' ' ' | tr '\n' ' ')
          read -ra URL_ARRAY <<< "$URLS"
          
          if [ ${#URL_ARRAY[@]} -eq 0 ]; then
            echo "No URLs provided"
            exit 1
          fi
          
          mkdir -p files-downloaded
          aria2c -x 16 -s 16 -d files-downloaded --console-log-level=warn --summary-interval=10 "${URL_ARRAY[@]}"
          
          # Save list of downloaded filenames for later use
          ls -1 files-downloaded > files-downloaded.txt
          echo "FILENAMES<<EOF" >> $GITHUB_OUTPUT
          cat files-downloaded.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Split and Zip (each file at archive root)
        run: |
          mkdir -p direct
          
          for FILE in files-downloaded/*; do
            [ -f "$FILE" ] || continue
            BASENAME=$(basename "$FILE")
            
            # Temporary directory to hold just this file
            mkdir -p tmpzip
            cp "$FILE" tmpzip/
            
            # Zip from inside tmpzip so the file lands at root
            (cd tmpzip && zip -s 99m "../direct/${BASENAME}.zip" "${BASENAME}")
            
            rm -rf tmpzip
          done

      - name: Upload to direct folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ -z "$(ls -A direct/)" ]; then
            echo "No files to upload."
            exit 0
          fi

          git add direct/
          # Commit message shows which files were added
          COMMIT_MSG="Add: $(tr '\n' ' ' < files-downloaded.txt | sed 's/ *$//') [skip ci]"
          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                sleep 3
              else
                exit 1
              fi
            fi
          done
