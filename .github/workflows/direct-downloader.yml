name: direct-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Enter the Direct Download URL'
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Download File (aria2)
        id: dl
        run: |
          URL="${{ github.event.inputs.url }}"
          mkdir -p files-downloaded
          # aria2c is faster and handles redirects better than wget
          aria2c -x 16 -s 16 -d files-downloaded --console-log-level=warn --summary-interval=10 "$URL"
          
          # Get the filename and save it for the next steps
          FILENAME=$(ls -1 files-downloaded | head -n1)
          echo "FILENAME=$FILENAME" >> $GITHUB_OUTPUT

      - name: Split and Zip (Fixed Headers)
        run: |
          FILENAME="${{ steps.dl.outputs.FILENAME }}"
          mkdir -p downloads
          
          # IMPORTANT: We CD into the folder so the zip header DOES NOT 
          # include the "files-downloaded/" prefix. This fixes the Header Error.
          cd files-downloaded
          zip -s 99m "../downloads/${FILENAME}.zip" "$FILENAME"
          cd ..

      - name: Upload to downloads folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ -z "$(ls -A downloads/)" ]; then
            echo "No files to upload."
            exit 0
          fi

          git add downloads/
          git commit -m "Add: ${{ steps.dl.outputs.FILENAME }} [skip ci]" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                sleep 3
              else
                exit 1
              fi
            fi
          done
