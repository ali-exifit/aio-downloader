---
name: direct-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: >
          Enter one or more Direct Download URLs.
          Separate by commas, spaces, or newlines.
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

      - name: Parse URLs
        id: parse
        run: |
          URLS_INPUT="${{ github.event.inputs.url }}"
          # Replace commas and newlines with spaces, then trim
          URLS=$(echo "$URLS_INPUT" | tr ',' ' ' | tr '\n' ' ')
          # Write clean URL list to a temporary file (one URL per line)
          echo "$URLS" | tr -s ' ' '\n' | sed '/^$/d' > urls.txt
          NUM_URLS=$(wc -l < urls.txt)
          echo "Detected $NUM_URLS URL(s):"
          cat urls.txt
          echo "NUM_URLS=$NUM_URLS" >> $GITHUB_OUTPUT

      - name: Download files (separately)
        run: |
          mkdir -p files-downloaded
          while IFS= read -r url; do
            echo "Downloading: $url"
            # aria2c will save the file using the remote filename.
            aria2c -x 16 -s 16 -d files-downloaded \
              --console-log-level=warn --summary-interval=10 \
              --auto-file-renaming=false "$url"
          done < urls.txt
        # If auto-renaming is off, aria2c will fail if a file already exists.
        # We catch that in the next step.

      - name: Handle filename collisions
        run: |
          cd files-downloaded
          # Give each file a unique name in case of duplicates
          for file in *; do
            [ -f "$file" ] || continue
            # If a file with this name already exists in the final list, suffix it
            base="$file"
            counter=1
            while [ -e "../final/$base" ]; do
              name="${file%.*}"    # filename without extension
              ext="${file##*.}"    # extension (if any)
              if [ "$ext" = "$file" ]; then
                # no extension
                base="${file}_$counter"
              else
                base="${name}_$counter.$ext"
              fi
              counter=$((counter + 1))
            done
            mv "$file" "../final/$base"
          done
          # Now all downloaded files are in ../final/ with unique names

      - name: Split and Zip (each file at archive root)
        run: |
          mkdir -p direct tmpzip final
          # At this point files are in final/ (moved from previous step)
          for file in final/*; do
            [ -f "$file" ] || continue
            fname=$(basename "$file")
            
            mkdir -p tmpzip
            cp "$file" "tmpzip/"
            
            # Create split zip directly in direct/ with the same unique filename
            (cd tmpzip && zip -s 99m "../direct/${fname}.zip" "${fname}")
            
            rm -rf tmpzip
          done
          rm -rf final   # cleanup

      - name: Upload to direct folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ -z "$(ls -A direct/)" ]; then
            echo "No files to upload."
            exit 0
          fi

          git add direct/
          # Build commit message from the unique filenames
          COMMIT_MSG="Add: $(ls -1 direct/ | tr '\n' ' ' | sed 's/ *$//') [skip ci]"
          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              [ $i -lt $RETRIES ] && sleep 3 || exit 1
            fi
          done
