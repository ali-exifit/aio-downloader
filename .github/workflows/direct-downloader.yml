name: direct-downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Enter the Direct Download URL'
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install aria2 and 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full

      - name: Download File
        id: download
        run: |
          URL="${{ github.event.inputs.url }}"
          mkdir -p files-downloaded
          
          # aria2c: -x16 (16 connections), -s16 (16 splits) for max speed
          # --console-log-level=warn reduces log clutter
          aria2c -x 16 -s 16 -d files-downloaded --summary-interval=5 --console-log-level=warn "$URL"
          
          # Identify the downloaded file
          FILENAME=$(ls -1 files-downloaded | head -n1)
          echo "FILENAME=$FILENAME" >> $GITHUB_OUTPUT
          echo "Downloaded: $FILENAME"

      - name: Split and Archive (7-Zip)
        run: |
          FILENAME="${{ steps.download.outputs.FILENAME }}"
          mkdir -p downloads
          
          # We 'cd' into the folder to avoid including 'files-downloaded/' in the zip structure
          cd files-downloaded
          
          # 7z options:
          # a: add to archive
          # -v99m: split into 99MB parts
          # -tzip: use standard zip format
          # -mx0: "Store" mode (no compression, much faster since files like .exe or .zip are already compressed)
          7z a -v99m -tzip -mx0 "../downloads/${FILENAME}.zip" "$FILENAME"
          
          cd ..
          echo "Created split volumes in /downloads"

      - name: Upload to downloads folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          FILES=(downloads/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No files to upload."
            exit 0
          fi

          git add downloads/
          git commit -m "Add download: ${{ steps.download.outputs.FILENAME }} [skip ci]" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "Push rejected, retrying in 3 seconds..."
                sleep 3
              else
                echo "Push failed after $RETRIES attempts."
                exit 1
              fi
            fi
          done
