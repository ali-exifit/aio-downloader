---
name: pinterest-downloader

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Pinterest URLs – separate by comma, space, or newline'
        required: true

jobs:
  actions:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # ---------- setup Node.js 24 ----------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ---------- extract URLs from input ----------
      - name: Parse input and extract URLs
        id: parse
        run: |
          INPUT="${{ github.event.inputs.urls }}"
          CLEANED=$(echo "$INPUT" | tr -d '"'\')
          URLS=$(echo "$CLEANED" | grep -oP 'https?://(www\.)?(pinterest\.[a-z.]+|pin\.it)/[^\s,;]+' | sort -u)
          if [ -z "$URLS" ]; then
            echo "ERROR: No Pinterest URLs found in the input."
            exit 1
          fi
          echo "$URLS" > urls.txt
          echo "Found $(wc -l < urls.txt) URL(s) to download."

      # ---------- write cookies from secrets ----------
      - name: Write cookies from secrets
        run: |
          if [ -n "$PINTEREST_COOKIES" ]; then
            echo "$PINTEREST_COOKIES" > pinterest-cookies.txt
            echo "Pinterest cookies written."
          else
            echo "No PINTEREST_COOKIES secret found – proceeding without login, may fail for private boards."
          fi
        env:
          PINTEREST_COOKIES: ${{ secrets.PINTEREST_COOKIES }}

      # ---------- cache & install tools ----------
      - name: Restore cached tools
        uses: actions/cache@v4
        id: tool-cache
        with:
          path: |
            ~/.local/bin/yt-dlp
            ~/.deno
            ~/.cache/pip
          key: fetch-tools-${{ runner.os }}-v3

      - name: Add cached tools to PATH
        run: |
          mkdir -p ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install tools
        run: |
          # Only install what's needed for Pinterest
          pip install gallery-dl

          if ! command -v jq &> /dev/null || ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq ffmpeg
          fi

      # ---------- download all Pinterest URLs ----------
      - name: Download Pinterest content
        run: |
          mkdir -p pinterest_downloads

          GALLERY_DL_ARGS=""
          if [ -f "pinterest-cookies.txt" ]; then
            GALLERY_DL_ARGS="$GALLERY_DL_ARGS --cookies pinterest-cookies.txt"
          fi

          gallery-dl $GALLERY_DL_ARGS \
                     --input-file urls.txt \
                     -d "pinterest_downloads" \
                     --verbose

          echo "Downloads finished. Contents:"
          ls -lhR pinterest_downloads/

      # ---------- create split ZIP archive with unique random suffix ----------
      - name: Create ZIP archive (split into 99 MB parts, unique name)
        id: zip
        run: |
          mkdir -p pinterest

          # Generate a unique 8-character suffix
          RANDSTR=$(uuidgen | tr '[:upper:]' '[:lower:]' | tr -d '-' | head -c 8)
          ZIP_NAME="pinterest-contents-${RANDSTR}.zip"

          echo "Using archive base name: ${ZIP_NAME}"
          zip -j -s 99m -r "pinterest/${ZIP_NAME}" pinterest_downloads/

          echo "Created archive parts:"
          ls -lh pinterest/

      # ---------- upload to repository ----------
      - name: Upload to 'pinterest' folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ ! -d "pinterest" ] || [ -z "$(ls -A pinterest)" ]; then
            echo "Nothing to upload."
            exit 0
          fi

          git add pinterest/
          git commit -m "Add Pinterest batch download [skip ci]" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              if [ $i -lt $RETRIES ]; then
                echo "Push rejected, retrying in 3 seconds..."
                sleep 3
              else
                echo "Push failed after $RETRIES attempts."
                exit 1
              fi
            fi
          done
          echo "All files uploaded to the 'pinterest' folder."
