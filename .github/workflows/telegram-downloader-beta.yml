name: telegram-downloader-beta
on:
  workflow_dispatch:
    inputs:
      telegram_links:
        description: >
          Telegram post links (max 1000). Separate by commas, spaces, or newlines.
        required: true

permissions:
  contents: write

jobs:
  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ── Install tools ────────────────────────────
      - name: Install aria2 and zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zip

      # ── Resolve Telegram links + download ────────
      - name: Resolve and download all files
        id: download
        run: |
          # Parse input
          INPUT="${{ github.event.inputs.telegram_links }}"
          # Replace commas and newlines with spaces
          URLS=$(echo "$INPUT" | tr ',' ' ' | tr '\n' ' ' | tr -s ' ' | sed 's/^ *//;s/ *$//')
          if [ -z "$URLS" ]; then
            echo "No Telegram links provided." >&2
            exit 1
          fi
          echo "$URLS" | tr ' ' '\n' > telegram_links.txt
          echo "Links to process:"
          cat telegram_links.txt

          # Download each file into a temporary folder
          mkdir -p downloads_tmp

          # Initialize counters and failed links file
          index=0
          success_count=0
          failed_count=0
          : > failed_links.txt   # create empty file for failed links

          while IFS= read -r link; do
            index=$((index + 1))
            echo "----------------------------------------"
            echo "Processing link $index: $link"

            # --- Resolve direct download URL and filename via API ---
            # Temporarily disable exit-on-error so we can handle failures gracefully
            set +e
            RESOLVE=$(curl -s -X POST "https://telegramdownloader.net/proxy.php" \
              -d "telegram_link=$link")
            CURL_EXIT_CODE=$?
            set -e

            # --- Check if curl itself failed ---
            if [ $CURL_EXIT_CODE -ne 0 ]; then
              echo "WARNING: curl failed for link $index: $link (exit code $CURL_EXIT_CODE)"
              echo "$link" >> failed_links.txt
              failed_count=$((failed_count + 1))
              continue
            fi

            # --- Check if response is empty ---
            if [ -z "$RESOLVE" ]; then
              echo "WARNING: Empty API response for link $index: $link"
              echo "$link" >> failed_links.txt
              failed_count=$((failed_count + 1))
              continue
            fi

            # --- Validate that response is valid JSON before parsing ---
            if ! echo "$RESOLVE" | jq empty 2>/dev/null; then
              echo "WARNING: Invalid JSON response for link $index: $link"
              echo "Raw response (first 200 chars): $(echo "$RESOLVE" | head -c 200)"
              echo "$link" >> failed_links.txt
              failed_count=$((failed_count + 1))
              continue
            fi

            # --- Extract values from JSON ---
            set +e
            DL_URL=$(echo "$RESOLVE" | jq -r '.data.data.link // empty')
            FILE_NAME=$(echo "$RESOLVE" | jq -r '.data.data.file_name // empty')
            JQ_EXIT_CODE=$?
            set -e

            # --- Check if jq succeeded and returned non-empty values ---
            if [ $JQ_EXIT_CODE -ne 0 ] || [ -z "$DL_URL" ] || [ -z "$FILE_NAME" ]; then
              echo "WARNING: Could not resolve link $index: $link"
              echo "DL_URL: $DL_URL"
              echo "FILE_NAME: $FILE_NAME"
              echo "$link" >> failed_links.txt
              failed_count=$((failed_count + 1))
              continue
            fi

            echo "Resolved: $FILE_NAME"

            # --- Download with aria2 (16 connections, retry) ---
            set +e
            aria2c -x 16 -s 16 \
              --console-log-level=warn \
              --summary-interval=10 \
              -d downloads_tmp \
              -o "$FILE_NAME" \
              "$DL_URL"
            ARIA_EXIT_CODE=$?
            set -e

            if [ $ARIA_EXIT_CODE -ne 0 ]; then
              echo "WARNING: Download failed for $FILE_NAME (link $index: $link)"
              echo "$link" >> failed_links.txt
              failed_count=$((failed_count + 1))
            else
              echo "Downloaded: $FILE_NAME"
              success_count=$((success_count + 1))
            fi
          done < telegram_links.txt

          # --- Report final results ---
          echo "========================================"
          echo "SUMMARY: Processed $index links."
          echo "  Successful downloads: $success_count"
          echo "  Failed downloads:     $failed_count"
          if [ $failed_count -gt 0 ]; then
            echo "  Failed links have been logged to failed_links.txt"
          fi
          echo "========================================"

          # Check if we got any files
          if [ -z "$(ls -A downloads_tmp 2>/dev/null)" ]; then
            echo "No files were downloaded." >&2
            exit 1
          fi

          echo "DOWNLOAD_COUNT=$index" >> $GITHUB_OUTPUT

      # ── Zip everything together ──────────────────
      - name: Zip all downloads
        id: zip
        run: |
          mkdir -p telegram/downloader

          # Generate a random 5-letter string (lowercase)
          RAND5=$(tr -dc 'a-z' </dev/urandom | head -c 5)
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ZIP_NAME="telegram_files_${TIMESTAMP}_${RAND5}.zip"

          # Create a temporary folder to assemble the zip contents
          TMPZIP="tmpzip_${RAND5}"
          mkdir -p "$TMPZIP"

          # Move downloaded files into the temp folder
          if [ -d "downloads_tmp" ] && [ "$(ls -A downloads_tmp 2>/dev/null)" ]; then
            mv downloads_tmp/* "$TMPZIP/"
          fi

          # Include the failed links log if it exists and is not empty
          if [ -f "failed_links.txt" ] && [ -s "failed_links.txt" ]; then
            cp failed_links.txt "$TMPZIP/failed_links.txt"
            echo "Included failed_links.txt in the archive."
          fi

          # Always split at 99 MB (Telegram's practical limit)
          (cd "$TMPZIP" && zip -s 99m -r "../telegram/downloader/${ZIP_NAME}" .)

          # Clean up temp folders
          rm -rf downloads_tmp "$TMPZIP"

          echo "ZIP_PATH=telegram/downloader/$ZIP_NAME" >> $GITHUB_OUTPUT

      # ── Push to repository (high reliability) ────
      - name: Upload to telegram/downloader folder
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git config http.postBuffer 524288000

          if [ ! -f "${{ steps.zip.outputs.ZIP_PATH }}" ]; then
            echo "No archive to upload."
            exit 1
          fi

          git add telegram/downloader/

          COMMIT_MSG="Add: ${{ steps.zip.outputs.ZIP_PATH }} [skip ci]"
          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"

          RETRIES=5
          for i in $(seq 1 $RETRIES); do
            echo "Push attempt $i..."
            git pull --rebase --autostash origin "$BRANCH"
            if git push origin "$BRANCH"; then
              echo "Push succeeded."
              break
            else
              [ $i -lt $RETRIES ] && sleep 3 || exit 1
            fi
          done
